name: ysp

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${YSP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]

  backend:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in the ignored root .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored root .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [web, private]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    environment:
      MYSQL_DATABASE: ysp
      MYSQL_USER: ysp
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored root .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u ysp ysp -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  web:
  private:
    internal: true

volumes:
  mysql_data:
    name: ysp_mysql_data
