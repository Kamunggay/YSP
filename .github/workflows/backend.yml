name: Backend health baseline
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build, static checks, fresh MySQL migrations and HTTP smoke
        shell: pwsh
        run: ./scripts/verify-backend.ps1
