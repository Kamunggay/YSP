name: Build runner-local CI image
description: Reuse optional GHA layers and retry without remote cache if unavailable.
inputs:
  target:
    description: Existing backend Dockerfile target
    required: true
  image:
    description: Attempt-owned local image tag
    required: true
  scope:
    description: Cache scope partitioned by target and writer
    required: true
runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build with optional GHA layer cache
      id: cached
      # Only this optimization may fail; the mandatory fallback must then build.
      continue-on-error: true
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: backend
        target: ${{ inputs.target }}
        tags: ${{ inputs.image }}
        load: true
        push: false
        cache-from: type=gha,version=2,scope=${{ inputs.scope }}
        cache-to: type=gha,version=2,scope=${{ inputs.scope }},mode=max,ignore-error=true
    - name: Build without remote cache after failed cached build
      if: ${{ steps.cached.outcome == 'failure' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: backend
        target: ${{ inputs.target }}
        tags: ${{ inputs.image }}
        load: true
        push: false
        no-cache: true
