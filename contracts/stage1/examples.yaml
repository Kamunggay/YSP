    response:
      status: '200'
      body:
        data:
        - id: 70000000-0000-4000-8000-000000000001
          chapter:
            id: 60000000-0000-4000-8000-000000000001
            reference: SYN-A
            display_name: Synthetic chapter A
            created_at: '2026-11-09T02:00:00.000000Z'
          duties:
