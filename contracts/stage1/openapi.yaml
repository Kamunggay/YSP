openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: YSP Stage 1 canonical HTTP agreement
  version: 0.7.0
  description: >-
    Tickets stage1-contracts-01/02/03/04/05/06/07, specification 19. Contract candidate, not implemented
    authentication. agreement.md defines normative security, retry and ownership rules.
    Only /api/health exists in scaffold 7287aa439876e7280075206b77f5f2a62b44de0a.
    Authentication and chapter discovery/context/action reads are specified. Controlled
    setup procedures have canonical schemas but no HTTP mutation API. No bearer tokens.
servers:
  - url: /
    description: Same origin as the browser; HTTPS required except isolated loopback development.
security: []
tags:
  - name: Scaffold
  - name: Authentication
  - name: Chapter authority
  - name: Paper evidence
  - name: Catalogue
  - name: Stock queries
  - name: Opening stock
  - name: Reservations and holds
paths:
  /api/v1/chapters/{chapter_id}/catalogue/items:
    get:
      operationId: listCatalogueItems
      tags:
      - Catalogue
      x-existence: new
      x-required-action: catalogue.read
      summary: listCatalogueItems
      description: Current full individual session/MFA, chapter membership and action-specific scoped duty are required
        on every call. Use x-stage1-action-duties and agreement.md ticket 03. No-store on every outcome. Safe GET
        accepts no body, no action key except the explicit by-key result lookup. Reject unknown/repeated selectors
        with 400 invalid_selector. Foreign/unknown records and linked IDs yield uniform 404 after current chapter
        admission; provider status grants no access. New specification only; absent from scaffold 7287aa4.
      security:
      - browserSession: []
      parameters:
      - $ref: '#/components/parameters/ChapterId'
      - $ref: '#/components/parameters/CatalogueLimit'
      - $ref: '#/components/parameters/CatalogueCursor'
      - $ref: '#/components/parameters/CatalogueStateFilter'
      - $ref: '#/components/parameters/CatalogueSearch'
      responses:
        '200':
          description: Current authorized result.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueItemList'
        '400':
          $ref: '#/components/responses/InvalidSelector'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ChapterAccessDenied'
        '404':
          $ref: '#/components/responses/CatalogueNotFound'
        '409':
          $ref: '#/components/responses/CatalogueSnapshotStale'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createCatalogueItem
      tags:
      - Catalogue
      x-existence: new
      x-required-action: catalogue.maintain
      summary: createCatalogueItem
      description: Exact same-origin Origin, session cookie and synchronized X-XSRF-TOKEN precede admission and input
        checks. Requires current catalogue.maintain INVENTORY duty and immutable resource chapter. X-Action-Key scope
        is chapter + actor + operationId; canonical fingerprint includes target resource ID and entire validated body.
        Atomic resource/version/history/audit/result, no stock movement or policy approval. Authorized same-key/same-payload
        returns original status/body with replay=true before new-intent material checks; different payload is 409
        action_key_conflict. Rejected/rolled-back intents retain no accepted key. Recovery lookups are canonical below.
        Retain receipts for chapter record lifetime. Creation starts active at version 1; PUT is full descriptive
        replacement with expected version, increments exactly once. State changes never delete history. Code and parent
        item are immutable; used unit/quantity meaning is immutable. Missing approved settings do not block descriptive
        maintenance. See agreement.md for per-kind constraints. All responses no-store. New, not implemented in scaffold.
      security:
      - browserSession: []
        csrfProof: []
      parameters:
      - $ref: '#/components/parameters/ChapterId'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/ActionKey'
      responses:
        '201':
          description: Current authorized result.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Action-Replayed:
              $ref: '#/components/headers/ActionReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueItemWriteResult'
        '400':
          $ref: '#/components/responses/CatalogueMalformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CatalogueWriteDenied'
        '404':
          $ref: '#/components/responses/CatalogueNotFound'
        '409':
          $ref: '#/components/responses/CatalogueConflict'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/InvalidInput'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogueItem'
