      summary: Complete password continuation with one protected recovery code
      description: >-
        Only challenge_authenticator continuation; password was already verified for
        this browser. Atomically consume one code and promote/rotate session. Invalid,
        expired, used and superseded-set codes all return the same invalid_factor 403.
        Recovery sets expire after 365 elapsed days or earlier rotation/reset/account
        disabling. Recovery authenticates identity, adds no membership/duty and cannot
        bypass current MFA/authority gates. It does not replace the lost authenticator;
        controlled reset is ticket 02. Never accept recovery codes as passwords or
        as proof for viewing/rotating another recovery set.
        Before checking new-intent continuation state, a current resulting browser
        lineage may replay its accepted exact key/payload for the original snapshot;
        no code is consumed again and no session promoted or rotated. Send current
        cookies and X-Action-Replayed=true; the UI then reads current session.
