components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: ysp_session
      description: >-
        Opaque server-side session cookie. On sign-in/out this may identify only an
        anonymous CSRF context; on continuation endpoints only narrow progress is
        authorized. Cookie possession is not proof of completed MFA or chapter access.
    csrfProof:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie, tied to this browser session.
  parameters:
    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PreparationId:
      name: preparation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    HoldId:
      name: hold_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReservationOperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReservationOperationName:
      name: operation_name
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ReservationMutationName'
    ReservationRfLine:
      name: rf_line_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    HoldState:
      name: status
      in: query
      required: false
      schema:
        enum:
        - active
        - cleared
    ReservationState:
      name: status
      in: query
      required: false
      schema:
        enum:
        - active
        - blocked
        - partially_blocked
        - fulfilled
        - released
        - closed_mixed
    ReservationCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: \S
    CatalogueResourceId:
      name: resource_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Chapter-owned opaque catalogue identity; unknown/foreign IDs are uniform 404.
    CatalogueVersion:
      name: material_version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      description: Exact retained descriptive version, never an authority token.
    StockVariantId:
      name: variant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: ''
    StockLotId:
      name: stock_lot_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: ''
    CatalogueOperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: ''
    CatalogueLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Default 25; one occurrence only.
    CatalogueCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Omit on first page; five-minute actor/chapter/authority/filter/limit/snapshot-bound opaque cursor.
    CatalogueStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
        - active
        - retired
        - all
      description: Default active. all includes retained retired resources.
    CatalogueSearch:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 80
      description: Trim outer ASCII spaces, ASCII case-insensitive literal prefix of code or display name; no wildcards.
    IntendedUseKind:
      name: intended_use
      in: query
      required: true
      schema:
        type: string
        enum:
        - internal_use
        - sale
        - booth_custody
      description: Read context only. Stage 1 creates internal RF demand only; this selector enables no later-stage
        writes.
    IntendedUnit:
      name: requesting_unit_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Optional named chapter requesting unit; omission is null and matches no named-unit restriction.
    IntendedEvent:
      name: event_id
      in: query
      required: false
