            Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/OriginDenied'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/sign-in:
    post:
      operationId: signInWithPassword
      tags: [Authentication]
      x-existence: new
      summary: Verify individual password and establish full or limited session
      description: >-
        Anonymous CSRF session required. Rotate session ID and CSRF token on password
        acceptance. For a new intent, existing identified sessions receive
        session_state_conflict; sign out before switching identity. An accepted same-key,
        same-payload intent returns its original snapshot only to the current resulting
        browser lineage, before this new-intent state check, without another promotion
        or cookie rotation. Send X-Action-Replayed=true and current cookie values;
        the consumer must read current session before navigating. Account absence,
        disabled account and wrong
        password have the same invalid_credentials response. MFA policy is derived
        from current grants, never a client role flag. Enrolled accounts always
        challenge; unenrolled approvers/administrators enroll; other unenrolled
        accounts may complete password-only authentication. No remember-me token.
      security: [{browserSession: [], csrfProof: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordSignIn'}
            example: {login: officer@example.invalid, password: Example-only-password-2026!}
      responses:
        '200': {$ref: '#/components/responses/SessionEstablished'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/OriginDenied'}
        '409': {$ref: '#/components/responses/SessionConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
