                      user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
                      next_step: enroll_authenticator
                      expires_at: '2026-11-08T02:10:00.000000Z'
                challengeRequired:
                  value:
                    data:
                      state: continuation
                      user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
                      next_step: challenge_authenticator
                      expires_at: '2026-11-08T02:10:00.000000Z'
                authenticated:
                  value:
                    data:
                      state: authenticated
                      user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
                      authentication_method: authenticator
                      mfa_required: true
                      authenticated_at: '2026-11-08T02:02:00.000000Z'
                      expires_at: '2026-11-08T04:02:00.000000Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
