        maxLength: 1024
      description: Five-minute cursor bound to actor/chapter/authority, operation/record, filters, limit and snapshot.
        Changed snapshot is 409 snapshot_stale. Foreign/invalid cursor is 400 invalid_selector.
  headers:
    NoStore:
      required: true
      schema: {const: no-store}
      example: no-store
      description: Applies to every /api/v1 response including chapter reads, errors and 204s.
    SessionCookies:
      required: true
      description: >-
        Two separate Set-Cookie fields (never comma-fold): ysp_session=<opaque>;
        Path=/; Secure; HttpOnly; SameSite=Lax and XSRF-TOKEN=<url-encoded-token>;
        Path=/; Secure; SameSite=Lax. No Domain, no persistent Max-Age. Both rotated
        on password acceptance and MFA completion, not every read. Non-Secure is
        allowed only on explicitly configured loopback HTTP development.
      schema: {type: string, minLength: 1}
      example: 'ysp_session=synthetic; Path=/; Secure; HttpOnly; SameSite=Lax'
    ExpiredCookies:
      required: true
      description: >-
        Two separate Set-Cookie fields expiring ysp_session and XSRF-TOKEN, matching
        their original Path=/, Secure and SameSite attributes; Max-Age=0. Session
        cookie remains HttpOnly. No new authenticated session is created.
      schema: {type: string, minLength: 1}
      example: 'ysp_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax'
    ActionReplayed:
      required: true
      description: >-
        false on first commitment, true on authorized same-key/same-payload snapshot
        delivery. Snapshots do not refresh authority/expiry. On replay, read current
        session before navigation or enabling actions. Never restore old cookies.
      schema: {type: string, enum: ['true', 'false']}
      example: 'false'
    RetryAfter:
      required: true
      description: Integer delta seconds until next allowed attempt, never an account-existence hint.
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
      example: '60'
