        '201':
          description: Pending secret; not proof of enrollment and no additional authority.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentResult'}
              example:
                data:
                  enrollment_id: 20000000-0000-4000-8000-000000000001
                  secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                  provisioning_uri: 'otpauth://totp/YSP:synthetic?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=YSP&algorithm=SHA1&digits=6&period=30'
                  expires_at: '2026-11-08T02:06:00.000000Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/EnrollmentDenied'}
        '409': {$ref: '#/components/responses/EnrollmentConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
