    RecordPolicyProcedure:
      type: object
      required:
      - procedure_id
      - action_key
      - operator_id
      - chapter_id
      - target_id
      - expected_version
      - reason
      - approvals
      - input
      additionalProperties: false
      properties:
        procedure_id:
          const: recordPolicy
        action_key:
          $ref: '#/components/schemas/Uuid'
        operator_id:
          $ref: '#/components/schemas/Uuid'
        chapter_id:
          $ref: '#/components/schemas/Uuid'
        target_id:
          $ref: '#/components/schemas/Uuid'
        expected_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        reason:
          type: string
          minLength: 1
          maxLength: 500
        approvals:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SetupApproval'
        input:
          type: object
          required:
          - setting_key
          - subject_id
          - ownership
          - value
          - value_schema_reference
          - effective_from
          - effective_until
          additionalProperties: false
          properties:
            setting_key:
              enum:
              - quantity_scale
              - valuation_rounding
              - ipc_authorization
              - rf_approval_route
              - reference_series
              - rop
              - target_level
              - price
              - allocation_priority
            subject_id:
              oneOf:
              - $ref: '#/components/schemas/Uuid'
              - type: 'null'
            ownership:
              enum:
              - operational
              - financial
            value:
              type: string
              minLength: 1
              maxLength: 2000
              description: Exact serialized value validated against the reviewed value_schema_reference for this key/subject;
                not executable text. Actual approved values are prerequisites, never examples as defaults.
            value_schema_reference:
              type: string
              minLength: 1
              maxLength: 200
            effective_from:
              $ref: '#/components/schemas/UtcInstant'
            effective_until:
              oneOf:
              - $ref: '#/components/schemas/UtcInstant'
              - type: 'null'
          allOf:
          - if:
              properties:
                setting_key:
                  enum:
                  - valuation_rounding
                  - price
            then:
              properties:
                ownership:
                  const: financial
            else:
              properties:
                ownership:
                  const: operational
          - if:
              properties:
                setting_key:
                  const: reference_series
            then:
              properties:
                subject_id:
                  type: 'null'
                value_schema_reference:
                  $ref: '#/components/schemas/ReferenceSeriesFamily'
      description: For reference_series only, exact reviewed value_schema_reference is an immutable family discriminator
        in applicability/uniqueness and consumer lookup with chapter/key/subject. Other setting identities are unchanged.
        See x-reference-series-policy-identity and agreement.md.
