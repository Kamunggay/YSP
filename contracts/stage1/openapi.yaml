        $ref: '#/components/schemas/Uuid'
      description: Optional chapter event; omission is null and matches no named-event restriction.
    NeededAt:
      name: needed_at
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/UtcInstant'
      description: Intended occurrence; server now and this instant must both satisfy restriction dates. No backdating
        authority.
    ExpectedUnit:
      name: unit_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Exact expected variant unit; no implicit conversion.
    EligibilityQuantity:
      name: quantity
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/StockQuantity'
      description: Strictly positive and exact approved scale; excess precision is 400 invalid_selector, never rounded.
    EligibilityRfLine:
      name: rf_line_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Optional existing same-chapter approved RF line; contextual scope and source demand rechecked. Omit
        for new demand.
    OperationName:
      name: operation_name
      in: query
      required: true
      schema:
        type: string
        enum:
        - createCatalogueItem
        - replaceCatalogueItem
        - createCatalogueVariant
        - replaceCatalogueVariant
        - createCatalogueUnit
        - replaceCatalogueUnit
        - createCatalogueLocation
        - replaceCatalogueLocation
      description: ''
    EvidenceId:
      in: path
      name: evidence_id
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Opaque identity; chapter, target and current duty admission precede disclosure.
    EvidenceVersionId:
      in: path
      name: version_id
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Opaque identity; chapter, target and current duty admission precede disclosure.
    AttachmentId:
      in: path
      name: attachment_id
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Opaque identity; chapter, target and current duty admission precede disclosure.
    EvidenceHistoryCursor:
      in: query
      name: cursor
      required: false
      description: Opaque five-minute cursor bound to actor, chapter, evidence, authority generation, history
        revision, limit and ascending version order. Changed/expired snapshot is 409; foreign cursor is 400.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    ChapterId:
      in: path
      name: chapter_id
      required: true
      description: Opaque resource chapter. Current membership is required before identifier validation/existence
        disclosure. Never inferred from selected UI context.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 60000000-0000-4000-8000-000000000001
    MembershipLimit:
      in: query
      name: limit
      required: false
      description: Integer page size; default 25. Unknown/repeated selectors are rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    MembershipCursor:
      in: query
      name: cursor
      required: false
      description: Opaque five-minute snapshot cursor bound to actor, membership/authority versions, limit and
        sort. Omit for the first page. No filters or alternate sort.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      example: synthetic-page-2
    Origin:
      in: header
      name: Origin
      required: true
      description: Must equal configured browser origin, including scheme/host/port; missing/null/foreign denied.
      schema: {type: string, format: uri}
      example: https://ysp.example.invalid
    ActionKey:
      in: header
      name: X-Action-Key
      required: true
      description: >-
        Client-generated UUID per intent. Scope and authentication-specific retry
        exceptions are normative in agreement.md. Missing/malformed is 400;
        different-payload reuse is 409. Never put keys or proofs in URLs.
      schema: {$ref: '#/components/schemas/Uuid'}
      example: 40000000-0000-4000-8000-000000000001
    IpcId:
      name: ipc_id
      in: path
      required: true
      description: Opaque chapter-owned identity; current admission precedes existence disclosure.
      schema:
        $ref: '#/components/schemas/Uuid'
    OpeningRmId:
      name: rm_id
      in: path
      required: true
