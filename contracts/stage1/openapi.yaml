          maxLength: 254
          description: Canonical login email; case-insensitive lookup. Not an opaque identity ID.
        password: {$ref: '#/components/schemas/Password'}
    EnrollmentRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: {$ref: '#/components/schemas/Password'}
    EnrollmentResult:
