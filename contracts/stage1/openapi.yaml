      description: >-
        Only challenge_authenticator continuation. Check current account/factor status
        and RFC 6238 code; reject invalid or previously consumed time-step identically.
        Atomically consume proof and promote session, rotating ID and CSRF. No reusable
        bearer continuation token. A new intent from a full session returns
        session_state_conflict. Before that state check, an accepted exact key/payload
        may replay its original outcome only to the current resulting browser lineage,
