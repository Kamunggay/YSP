openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: YSP Stage 1 canonical HTTP agreement
  version: 0.2.0
  description: >-
    Tickets stage1-contracts-01/02, specification 19. Contract candidate, not implemented
    authentication. agreement.md defines normative security, retry and ownership rules.
    Only /api/health exists in scaffold 7287aa439876e7280075206b77f5f2a62b44de0a.
    Authentication and chapter discovery/context/action reads are specified. Controlled
    setup procedures have canonical schemas but no HTTP mutation API. No bearer tokens.
servers:
  - url: /
    description: Same origin as the browser; HTTPS required except isolated loopback development.
security: []
tags:
  - name: Scaffold
  - name: Authentication
  - name: Chapter authority
paths:
  /api/health:
    get:
      operationId: readScaffoldHealth
      tags: [Scaffold]
      x-existence: existing
      summary: Check running Laravel connectivity to real MySQL
      description: >-
        Preserves backend/routes/api.php and HealthController, including its unwrapped
        JSON body. Not renamed to /api/v1/health. Framework /up is a separate HTML
        process probe, not this application API or a business/authentication endpoint.
      responses:
        '200':
          description: MySQL SELECT 1 succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [database]
                additionalProperties: false
                properties:
                  database: {const: connected}
              example: {database: connected}
        '503':
          description: MySQL query failed; diagnostic details remain server-side.
          content:
            application/json:
              schema:
                type: object
                required: [database]
                additionalProperties: false
                properties:
                  database: {const: unavailable}
              example: {database: unavailable}
  /api/v1/auth/csrf:
    get:
      operationId: initializeBrowserCsrf
      tags: [Authentication]
      x-existence: new
      summary: Initialize anonymous session and synchronize CSRF cookie
      description: >-
        Same-origin only. Preserve an existing valid full/continuation session; never
        reset its identity, expiry or MFA proof. Set ysp_session when absent and always
        synchronize XSRF-TOKEN. No sign-in and no business authority. Forbidden origins
        receive 403. No CORS allow-credentials for foreign origins.
      responses:
        '204':
          description: No body; two separate Set-Cookie header fields as described below.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/OriginDenied'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/sign-in:
    post:
      operationId: signInWithPassword
      tags: [Authentication]
      x-existence: new
      summary: Verify individual password and establish full or limited session
      description: >-
        Anonymous CSRF session required. Rotate session ID and CSRF token on password
        acceptance. For a new intent, existing identified sessions receive
        session_state_conflict; sign out before switching identity. An accepted same-key,
        same-payload intent returns its original snapshot only to the current resulting
        browser lineage, before this new-intent state check, without another promotion
        or cookie rotation. Send X-Action-Replayed=true and current cookie values;
        the consumer must read current session before navigating. Account absence,
        disabled account and wrong
        password have the same invalid_credentials response. MFA policy is derived
        from current grants, never a client role flag. Enrolled accounts always
        challenge; unenrolled approvers/administrators enroll; other unenrolled
        accounts may complete password-only authentication. No remember-me token.
      security: [{browserSession: [], csrfProof: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordSignIn'}
            example: {login: officer@example.invalid, password: Example-only-password-2026!}
      responses:
        '200': {$ref: '#/components/responses/SessionEstablished'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/OriginDenied'}
        '409': {$ref: '#/components/responses/SessionConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/session:
    get:
      operationId: readCurrentSession
      tags: [Authentication]
      x-existence: new
      summary: Read only current identity and authentication progress
      description: >-
        Both continuation and full sessions may read this projection. Never return
        password hashes, TOTP seeds/URIs, recovery values, delivery receipts, chapter
        grants or business records. Required MFA is re-evaluated on reads and all
        protected actions. An anonymous, expired, revoked or disabled session is 401.
      security: [{browserSession: []}]
      responses:
        '200':
          description: Identity and progress; no secrets. Times are authoritative UTC.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResult'}
              examples:
                enrollmentRequired:
                  value:
                    data:
                      state: continuation
                      user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
                      next_step: enroll_authenticator
                      expires_at: '2026-11-08T02:10:00.000000Z'
                challengeRequired:
                  value:
                    data:
                      state: continuation
                      user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
                      next_step: challenge_authenticator
                      expires_at: '2026-11-08T02:10:00.000000Z'
                authenticated:
                  value:
                    data:
                      state: authenticated
                      user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
                      authentication_method: authenticator
                      mfa_required: true
                      authenticated_at: '2026-11-08T02:02:00.000000Z'
                      expires_at: '2026-11-08T04:02:00.000000Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/sign-out:
    post:
      operationId: signOutCurrentBrowser
      tags: [Authentication]
      x-existence: new
      summary: Revoke this browser session and invalidate authentication continuation
      description: >-
        Allowed for full, continuation and anonymous CSRF sessions. Atomically revoke
        this session, its pending enrollment and secret delivery receipts. Expire both
        cookies. No other browser is signed out. If the response is lost, initialize
        anonymous CSRF again and repeat: 204 remains safe. Origin/CSRF are still required;
        an expired cookie must be initialized before retry. No request body.
      security: [{browserSession: [], csrfProof: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ActionKey'}
      responses:
        '204':
          description: No body. This browser has no authenticated or continuation session.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Set-Cookie: {$ref: '#/components/headers/ExpiredCookies'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/OriginDenied'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/authenticator/enrollments:
    post:
      operationId: beginAuthenticatorEnrollment
      tags: [Authentication]
      x-existence: new
      summary: Prepare this account's first authenticator in the browser
      description: >-
        Allowed for enroll_authenticator continuation or a full password session with
        no enrolled factor. Current password is required in both cases. Never replace
        an enabled factor; administrative reset belongs to ticket 02. One unconfirmed
        enrollment per session/account; exact same-key retry returns the same pending
        secret until expiry. A different key while pending is enrollment_pending (409).
        RFC 6238 TOTP: SHA-1, 6 digits, 30-second step, +/- one step, reject accepted
        time-step reuse per account. Pending secret expires after 5 minutes, capped by
        continuation expiry. The URI is rendered locally as a QR code, not sent to a
        third-party QR service. Synthetic examples are not operational credentials.
      security: [{browserSession: [], csrfProof: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentRequest'}
            example: {password: Example-only-password-2026!}
      responses:
        '201':
          description: Pending secret; not proof of enrollment and no additional authority.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentResult'}
              example:
                data:
                  enrollment_id: 20000000-0000-4000-8000-000000000001
                  secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                  provisioning_uri: 'otpauth://totp/YSP:synthetic?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=YSP&algorithm=SHA1&digits=6&period=30'
                  expires_at: '2026-11-08T02:06:00.000000Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/EnrollmentDenied'}
        '409': {$ref: '#/components/responses/EnrollmentConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/authenticator/enrollments/confirm:
    post:
      operationId: confirmAuthenticatorEnrollment
      tags: [Authentication]
      x-existence: new
      summary: Prove pending factor and deliver initial recovery set
      description: >-
        Same enrollment owner/session and current password plus current pending TOTP
        required. Atomically enable factor, consume pending secret/time-step, create
        recovery set and complete MFA. Rotate session ID and CSRF. Response contains
        exactly ten one-time recovery codes. Lost-response handling and bounded
        encrypted secret-delivery replay are defined in agreement.md. Never return
        codes in readCurrentSession or readRecoveryCodeStatus.
      security: [{browserSession: [], csrfProof: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentConfirmation'}
            example:
              enrollment_id: 20000000-0000-4000-8000-000000000001
              password: Example-only-password-2026!
              authenticator_code: '123456'
      responses:
        '200': {$ref: '#/components/responses/InitialRecoverySetDelivered'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/EnrollmentDenied'}
        '409': {$ref: '#/components/responses/ConfirmationConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/authenticator/challenge:
    post:
      operationId: completeAuthenticatorChallenge
      tags: [Authentication]
      x-existence: new
      summary: Complete password continuation using enrolled authenticator
      description: >-
        Only challenge_authenticator continuation. Check current account/factor status
        and RFC 6238 code; reject invalid or previously consumed time-step identically.
        Atomically consume proof and promote session, rotating ID and CSRF. No reusable
        bearer continuation token. A new intent from a full session returns
        session_state_conflict. Before that state check, an accepted exact key/payload
        may replay its original outcome only to the current resulting browser lineage,
        without reconsuming TOTP or promoting/rotating a session. The replay sends
        current cookies and X-Action-Replayed=true; inspect current session.
      security: [{browserSession: [], csrfProof: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthenticatorChallenge'}
            example: {authenticator_code: '123456'}
      responses:
        '200': {$ref: '#/components/responses/AuthenticatorCompleted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ChallengeDenied'}
        '409': {$ref: '#/components/responses/SessionConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/recovery/challenge:
    post:
      operationId: completeRecoveryChallenge
      tags: [Authentication]
      x-existence: new
      summary: Complete password continuation with one protected recovery code
      description: >-
        Only challenge_authenticator continuation; password was already verified for
        this browser. Atomically consume one code and promote/rotate session. Invalid,
        expired, used and superseded-set codes all return the same invalid_factor 403.
        Recovery sets expire after 365 elapsed days or earlier rotation/reset/account
        disabling. Recovery authenticates identity, adds no membership/duty and cannot
        bypass current MFA/authority gates. It does not replace the lost authenticator;
        controlled reset is ticket 02. Never accept recovery codes as passwords or
        as proof for viewing/rotating another recovery set.
        Before checking new-intent continuation state, a current resulting browser
        lineage may replay its accepted exact key/payload for the original snapshot;
        no code is consumed again and no session promoted or rotated. Send current
        cookies and X-Action-Replayed=true; the UI then reads current session.
      security: [{browserSession: [], csrfProof: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryChallenge'}
            example: {recovery_code: 'ABCD-EFGH-JKLM-NPQR'}
      responses:
        '200': {$ref: '#/components/responses/RecoveryCompleted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ChallengeDenied'}
        '409': {$ref: '#/components/responses/SessionConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/recovery-codes:
    get:
      operationId: readRecoveryCodeStatus
      tags: [Authentication]
      x-existence: new
      summary: Read recovery-set metadata only after completed authentication
      description: >-
        Full session with enabled authenticator only; continuation is mfa_incomplete.
        Never returns code values or secret-delivery receipts. remaining counts only
        unused, unexpired values. An expired set remains visible with remaining 0;
        no set is null. Query parameters, sorting and pagination do not apply.
      security: [{browserSession: []}]
      responses:
        '200':
          description: Metadata only; null means no set exists.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryStatusResult'}
              examples:
                active:
                  value:
                    data:
                      recovery_set:
                        id: 30000000-0000-4000-8000-000000000001
                        remaining: 9
                        created_at: '2026-11-08T02:02:00.000000Z'
                        expires_at: '2027-11-08T02:02:00.000000Z'
                absent: {value: {data: {recovery_set: null}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/FullSessionRequired'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/recovery-codes/rotate:
    post:
      operationId: rotateRecoveryCodes
      tags: [Authentication]
      x-existence: new
      summary: Replace all recovery codes with fresh password and authenticator proof
      description: >-
        Full session, enabled authenticator, current password and unused current TOTP
        required even after recovery sign-in. expected_recovery_set_id must equal the
        current set (null only if none); serialize against consumption/rotation/reset.
        On commitment revoke every previous code, issue ten fresh codes and persist
        bounded encrypted delivery atomically. No public reveal/delete/disable-factor
        or administrative-reset endpoint. Rotation does not grant authority or extend
        the session's absolute lifetime. Conflicts consume no proof/key or new set.
      security: [{browserSession: [], csrfProof: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotateRecoveryCodes'}
            example:
              password: Example-only-password-2026!
              authenticator_code: '654321'
              expected_recovery_set_id: 30000000-0000-4000-8000-000000000001
      responses:
        '200': {$ref: '#/components/responses/RecoverySetDelivered'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/RecoveryRotationDenied'}
        '409': {$ref: '#/components/responses/RotationConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/memberships:
    get:
      operationId: listMyChapterMemberships
      tags:
      - Chapter authority
      x-existence: new
      summary: Discover only currently authorized active chapter memberships
      description: Requires current enabled individual and full authentication, including current MFA policy.
        Recheck account and authority on every read; no CSRF proof/action key on safe GETs. Reject request bodies.
        Cache-Control no-store on all outcomes. Pre-chapter discovery returns an empty page for a provisioner
        with no membership. Sort by chapter.created_at ascending then chapter.id ascending. Only limit/cursor
        are accepted; cursor expires after five minutes and binds the complete current membership snapshot. No
        server-side selected chapter is changed.
      security:
      - browserSession: []
      parameters:
      - $ref: '#/components/parameters/MembershipLimit'
      - $ref: '#/components/parameters/MembershipCursor'
      responses:
        '200':
          description: Current authorized projection only.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '400':
          $ref: '#/components/responses/InvalidSelector'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ChapterAccessDenied'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/AuthoritySnapshotStale'
  /api/v1/chapters/{chapter_id}/context:
    get:
      operationId: readChapterContext
      tags:
      - Chapter authority
      x-existence: new
      summary: Read an authorized chapter before explicitly selecting visible UI context
      description: Requires current enabled individual and full authentication, including current MFA policy.
        Recheck account and authority on every read; no CSRF proof/action key on safe GETs. Reject request bodies.
        Cache-Control no-store on all outcomes. Business URL fixes the resource chapter. Selection stays in UI
        memory, creates no grant and cannot relabel an unfinished form. Unknown/inactive/foreign/revoked membership
        is uniformly 404 after full-session admission. A previously rendered action or old outcome/link grants
        no authority. The access projection is advisory, not a reservation, approval or commit token; contextual
        independence/material checks remain required.
      security:
      - browserSession: []
      parameters:
      - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Current authorized projection only.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterContextResult'
        '400':
          $ref: '#/components/responses/InvalidSelector'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ChapterAccessDenied'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/ChapterUnavailable'
  /api/v1/chapters/{chapter_id}/access:
    get:
      operationId: readChapterAccess
      tags:
      - Chapter authority
      x-existence: new
      summary: Read advisory current duties, actions and setup blockers
      description: Requires current enabled individual and full authentication, including current MFA policy.
        Recheck account and authority on every read; no CSRF proof/action key on safe GETs. Reject request bodies.
        Cache-Control no-store on all outcomes. Business URL fixes the resource chapter. Selection stays in UI
        memory, creates no grant and cannot relabel an unfinished form. Unknown/inactive/foreign/revoked membership
        is uniformly 404 after full-session admission. A previously rendered action or old outcome/link grants
        no authority. The access projection is advisory, not a reservation, approval or commit token; contextual
        independence/material checks remain required.
      security:
      - browserSession: []
      parameters:
      - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Current authorized projection only.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterAccessResult'
        '400':
          $ref: '#/components/responses/InvalidSelector'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ChapterAccessDenied'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/ChapterUnavailable'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: ysp_session
      description: >-
        Opaque server-side session cookie. On sign-in/out this may identify only an
        anonymous CSRF context; on continuation endpoints only narrow progress is
        authorized. Cookie possession is not proof of completed MFA or chapter access.
    csrfProof:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie, tied to this browser session.
  parameters:
    ChapterId:
      in: path
      name: chapter_id
      required: true
      description: Opaque resource chapter. Current membership is required before identifier validation/existence
        disclosure. Never inferred from selected UI context.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 60000000-0000-4000-8000-000000000001
    MembershipLimit:
      in: query
      name: limit
      required: false
      description: Integer page size; default 25. Unknown/repeated selectors are rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    MembershipCursor:
      in: query
      name: cursor
      required: false
      description: Opaque five-minute snapshot cursor bound to actor, membership/authority versions, limit and
        sort. Omit for the first page. No filters or alternate sort.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      example: synthetic-page-2
    Origin:
      in: header
      name: Origin
      required: true
      description: Must equal configured browser origin, including scheme/host/port; missing/null/foreign denied.
      schema: {type: string, format: uri}
      example: https://ysp.example.invalid
    ActionKey:
      in: header
      name: X-Action-Key
      required: true
      description: >-
        Client-generated UUID per intent. Scope and authentication-specific retry
        exceptions are normative in agreement.md. Missing/malformed is 400;
        different-payload reuse is 409. Never put keys or proofs in URLs.
      schema: {$ref: '#/components/schemas/Uuid'}
      example: 40000000-0000-4000-8000-000000000001
  headers:
    NoStore:
      required: true
      schema: {const: no-store}
      example: no-store
      description: Applies to every /api/v1 response including chapter reads, errors and 204s.
    SessionCookies:
      required: true
      description: >-
        Two separate Set-Cookie fields (never comma-fold): ysp_session=<opaque>;
        Path=/; Secure; HttpOnly; SameSite=Lax and XSRF-TOKEN=<url-encoded-token>;
        Path=/; Secure; SameSite=Lax. No Domain, no persistent Max-Age. Both rotated
        on password acceptance and MFA completion, not every read. Non-Secure is
        allowed only on explicitly configured loopback HTTP development.
      schema: {type: string, minLength: 1}
      example: 'ysp_session=synthetic; Path=/; Secure; HttpOnly; SameSite=Lax'
    ExpiredCookies:
      required: true
      description: >-
        Two separate Set-Cookie fields expiring ysp_session and XSRF-TOKEN, matching
        their original Path=/, Secure and SameSite attributes; Max-Age=0. Session
        cookie remains HttpOnly. No new authenticated session is created.
      schema: {type: string, minLength: 1}
      example: 'ysp_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax'
    ActionReplayed:
      required: true
      description: >-
        false on first commitment, true on authorized same-key/same-payload snapshot
        delivery. Snapshots do not refresh authority/expiry. On replay, read current
        session before navigation or enabling actions. Never restore old cookies.
      schema: {type: string, enum: ['true', 'false']}
      example: 'false'
    RetryAfter:
      required: true
      description: Integer delta seconds until next allowed attempt, never an account-existence hint.
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
      example: '60'
