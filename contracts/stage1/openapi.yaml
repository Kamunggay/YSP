          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        supersedes_version_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        superseded_by_version_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        technical_state:
          enum:
          - ready
          - invalid
        invalid_reason:
          enum:
          - null
          - object_missing
          - integrity_failed
          - unsafe_content
        uploaded_by:
          $ref: '#/components/schemas/Uuid'
        uploaded_at:
          $ref: '#/components/schemas/UtcInstant'
        replacement_reason:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
        attachments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaperAttachment'
      allOf:
      - if:
          properties:
            technical_state:
              const: ready
        then:
          properties:
            invalid_reason:
              type: 'null'
        else:
          properties:
            invalid_reason:
              type: string
      - if:
          properties:
            version:
              const: 1
        then:
          properties:
            supersedes_version_id:
              type: 'null'
            replacement_reason:
              type: 'null'
        else:
          properties:
            supersedes_version_id:
              $ref: '#/components/schemas/Uuid'
            replacement_reason:
              type: string
