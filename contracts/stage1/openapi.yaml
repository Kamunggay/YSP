      - target
      - version_id
      - version
      - supersedes_version_id
      - superseded_by_version_id
      - technical_state
      - invalid_reason
      - uploaded_by
      - uploaded_at
      - replacement_reason
      - attachments
      properties:
        evidence_id:
          $ref: '#/components/schemas/Uuid'
        chapter_id:
          $ref: '#/components/schemas/Uuid'
        target:
          $ref: '#/components/schemas/EvidenceTarget'
