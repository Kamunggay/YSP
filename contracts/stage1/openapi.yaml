              properties:
                id: {$ref: '#/components/schemas/Uuid'}
                codes:
                  type: array
                  minItems: 10
                  maxItems: 10
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/RecoveryCode'}
                created_at: {$ref: '#/components/schemas/UtcInstant'}
                expires_at: {$ref: '#/components/schemas/UtcInstant'}
