          $ref: '#/components/schemas/UtcInstant'
        outcome:
          const: committed
        result:
          $ref: '#/components/schemas/InternalRf'
    RfMutationResult:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/RfOperationReceipt'
    RfConflict:
      type: object
      additionalProperties: false
      required:
      - request_id
      - error
      - current
      - setup_blockers
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              enum:
              - material_version_conflict
              - progress_version_conflict
              - state_conflict
              - action_key_conflict
              - setup_blocked
              - resource_retired
              - commitment_conflict
              - handover_unresolved
              - approval_authority_revoked
              - snapshot_stale
            message:
              type: string
              minLength: 1
              maxLength: 500
              pattern: \S
        current:
          anyOf:
          - $ref: '#/components/schemas/InternalRf'
          - type: 'null'
        setup_blockers:
          type: array
          items:
            $ref: '#/components/schemas/SetupBlocker'
    RfHistoryEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - material_version
      - progress_version
      - action
      - actor
      - reason
      - reference
      - occurred_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        material_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        progress_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        action:
          enum:
          - createInternalRf
          - replaceInternalRfDraft
          - submitInternalRf
          - approveInternalRf
          - returnInternalRf
          - reviseInternalRf
          - cancelInternalRf
          - reservation_changed
          - issue_posted
          - approval_invalidated
        actor:
          $ref: '#/components/schemas/RfActor'
        reason:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 500
            pattern: \S
          - type: 'null'
        reference:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 80
            pattern: \S
          - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/UtcInstant'
    RfHistoryList:
      type: object
      additionalProperties: false
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RfHistoryEntry'
        page:
          $ref: '#/components/schemas/CataloguePage'
    RfRelatedRecord:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      - rf_line_id
      - reference
      - material_version
      - state
      properties:
        kind:
          enum:
          - reservation
          - hold
          - actual_issue
          - inventory_movement
        id:
          $ref: '#/components/schemas/Uuid'
        rf_line_id:
          $ref: '#/components/schemas/Uuid'
        reference:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 80
            pattern: \S
          - type: 'null'
        material_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        state:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
    RfRelatedList:
      type: object
      additionalProperties: false
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RfRelatedRecord'
        page:
          $ref: '#/components/schemas/CataloguePage'
    ReferenceSeriesFamily:
      type: string
      enum:
      - '#/components/schemas/OpeningReferencePolicyValue'
      - '#/components/schemas/RfReferenceSeriesPolicyValue'
  responses:
    CatalogueNotFound:
      description: chapter_not_found for unknown/foreign/inactive chapter or missing membership; otherwise resource_not_found
        uniformly for unknown/foreign/inaccessible resource, related ID, version or outcome within an admitted chapter.
        No private existence detail.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      type: string
                      enum:
                      - chapter_not_found
                      - resource_not_found
    CatalogueConflict:
      description: No mutation/result on rejection. Read current authorized detail/version/settings, preserve entered
        input and explicitly review. Accepted-key replay precedes stale-version checks.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogueWriteConflict'
    CatalogueSnapshotStale:
      description: Expired cursor or changed authority/catalogue/stock snapshot. Restart first page with preserved filters.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      type: string
                      enum:
                      - snapshot_stale
    CatalogueMalformed:
      description: Missing/malformed action key, malformed JSON, duplicate key/header or invalid/unknown query selector.
        No mutation/result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      type: string
                      enum:
                      - malformed_request
                      - invalid_selector
    EligibilityConflict:
      description: Stale query snapshot or existing RF line mismatches exact variant/intended context. Re-read current
        authorized demand; no implicit reallocation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      type: string
                      enum:
                      - snapshot_stale
                      - eligibility_context_conflict
    CatalogueWriteDenied:
      description: Foreign/missing Origin before CSRF; limited MFA or insufficient duty after session admission. No
        resource details.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      type: string
                      enum:
                      - origin_denied
                      - mfa_incomplete
                      - duty_denied
    EvidenceNotFound:
      description: chapter_not_found for unknown/inactive/foreign chapter or revoked membership; evidence_not_found
        uniformly for absent/foreign/record-scope-denied evidence, target, version or attachment inside an
        admitted chapter. No name, signature, hash, target or existence hint.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - chapter_not_found
                      - evidence_not_found
    EvidenceConflict:
      description: Stale expected version, changed key payload, expired/changed history cursor, or committed
        target rejects with no change. Error contains no current private snapshot; refetch permitted metadata
        explicitly.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - version_conflict
                      - action_key_conflict
                      - snapshot_stale
                      - target_locked
    InvalidEvidence:
      description: Invalid fields, absent/empty/unsupported/malformed/unsafe/content-mismatched file; all
        parts rejected atomically. JSON pointers refer to multipart model fields and zero-based attachment
        positions. Preserve unrelated form edits.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvidenceValidationError'
    EvidenceTooLarge:
      description: A file exceeds 10485760 bytes; discard the complete attempted version. An ingress whole-request
        bound must permit multiple maximum-sized files, and any ingress rejection must return this JSON envelope
        without disclosing content. Preserve form inputs.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - evidence_too_large
    EvidenceUnavailable:
      description: Upload storage/validation infrastructure failed or retained object is unavailable/invalid.
        No ready result or partial version is published. Retrieve no partial/corrupt bytes; retry/reconcile
        using the same intent. No physical handover retry implied.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - evidence_unavailable
                      - service_unavailable
    ChapterAccessDenied:
      description: mfa_incomplete for limited authentication; duty_denied for a visible chapter with insufficient
        duty. No protected state is returned
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - mfa_incomplete
                      - duty_denied
          example:
            error:
              code: mfa_incomplete
              message: mfa_incomplete for limited authentication; duty_denied for a visible chapter with insufficient
                duty.
            request_id: 50000000-0000-4000-8000-000000000001
    ChapterUnavailable:
      description: chapter_not_found uniformly for unknown, inactive, foreign or revoked chapter membership, including
        a provider without membership. No chapter existence or name disclosed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - chapter_not_found
          example:
            error:
              code: chapter_not_found
              message: chapter_not_found uniformly for unknown, inactive, foreign or revoked chapter membership,
                including a provider without membership.
            request_id: 50000000-0000-4000-8000-000000000001
    InvalidSelector:
      description: invalid_selector for unknown/repeated/malformed query, malformed chapter UUID after admission
        or mismatched cursor
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - invalid_selector
          example:
            error:
              code: invalid_selector
              message: invalid_selector for unknown/repeated/malformed query, malformed chapter UUID after admission
                or mismatched cursor.
            request_id: 50000000-0000-4000-8000-000000000001
    AuthoritySnapshotStale:
      description: snapshot_stale for expired cursor or changed membership/authority snapshot. Restart listing;
        never return removed authority
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - snapshot_stale
          example:
            error:
              code: snapshot_stale
              message: snapshot_stale for expired cursor or changed membership/authority snapshot.
            request_id: 50000000-0000-4000-8000-000000000001
    SessionEstablished:
      description: Password accepted; inspect state/next_step, not just HTTP 200.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PasswordSignInResult'}
          example:
            data:
              state: continuation
              user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
              next_step: challenge_authenticator
              expires_at: '2026-11-08T02:10:00.000000Z'
    AuthenticatorCompleted:
      description: MFA complete; no chapter authority is created. Re-read current authority before business access.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/MfaSessionResult'}
              - properties: {data: {properties: {authentication_method: {const: authenticator}}}}
          examples:
            authenticator:
              value:
                data:
                  state: authenticated
                  user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
                  authentication_method: authenticator
                  mfa_required: true
                  authenticated_at: '2026-11-08T02:02:00.000000Z'
                  expires_at: '2026-11-08T04:02:00.000000Z'
    RecoveryCompleted:
      description: Recovery proof consumed once; identity restored without adding chapter authority.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/MfaSessionResult'}
              - properties: {data: {properties: {authentication_method: {const: recovery_code}}}}
          example:
            data:
              state: authenticated
              user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
              authentication_method: recovery_code
              mfa_required: true
              authenticated_at: '2026-11-08T02:02:00.000000Z'
              expires_at: '2026-11-08T04:02:00.000000Z'
    RecoverySetDelivered:
      description: Sensitive rotated recovery set; bounded delivery replay. Session cookies do not change.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecoverySetDelivery'}
          examples:
            delivered: {$ref: '#/components/examples/RecoveryDelivery'}
    InitialRecoverySetDelivered:
      description: >-
        Sensitive initial recovery set. Confirmation rotates both cookies; bounded
        same-key delivery replay synchronizes current cookies without another rotation.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecoverySetDelivery'}
          examples:
            delivered: {$ref: '#/components/examples/RecoveryDelivery'}
    BadRequest:
      description: malformed_request for malformed JSON, forbidden query/body, missing/malformed action key or duplicate selectors.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: malformed_request}}}}
          example: {error: {code: malformed_request, message: Invalid request syntax.}, request_id: 50000000-0000-4000-8000-000000000001}
    InvalidCredentials:
      description: Unknown/disabled account or incorrect password, without distinguishing which.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: invalid_credentials}}}}
          example: {error: {code: invalid_credentials, message: Sign-in failed.}, request_id: 50000000-0000-4000-8000-000000000001}
    Unauthenticated:
      description: Missing/expired/revoked/disabled session or expired continuation; restart password sign-in.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: unauthenticated}}}}
          example: {error: {code: unauthenticated, message: Sign in again.}, request_id: 50000000-0000-4000-8000-000000000001}
    OriginDenied:
      description: origin_denied for missing/null/foreign Origin on unsafe requests, or foreign CSRF initialization.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: origin_denied}}}}
          example: {error: {code: origin_denied, message: Browser origin denied.}, request_id: 50000000-0000-4000-8000-000000000001}
    EnrollmentDenied:
      description: origin_denied, continuation_mismatch or invalid_factor (wrong password/TOTP); no factor information leaked.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [origin_denied, continuation_mismatch, invalid_factor]}}}}
          example: {error: {code: invalid_factor, message: Authentication proof was not accepted.}, request_id: 50000000-0000-4000-8000-000000000001}
    ChallengeDenied:
      description: origin_denied, continuation_mismatch or invalid_factor (invalid/expired/consumed/superseded factor, uniformly).
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [origin_denied, continuation_mismatch, invalid_factor]}}}}
          example: {error: {code: invalid_factor, message: Authentication proof was not accepted.}, request_id: 50000000-0000-4000-8000-000000000001}
    FullSessionRequired:
      description: mfa_incomplete for continuation; factor_not_enrolled for password-only full session without factor.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [mfa_incomplete, factor_not_enrolled]}}}}
          example: {error: {code: mfa_incomplete, message: Complete multifactor authentication first.}, request_id: 50000000-0000-4000-8000-000000000001}
    RecoveryRotationDenied:
      description: origin_denied, mfa_incomplete, factor_not_enrolled or invalid_factor (fresh password/TOTP failed).
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [origin_denied, mfa_incomplete, factor_not_enrolled, invalid_factor]}}}}
          example: {error: {code: invalid_factor, message: Authentication proof was not accepted.}, request_id: 50000000-0000-4000-8000-000000000001}
    SessionConflict:
      description: session_state_conflict for a new intent from wrong session state, or action_key_conflict for different-payload accepted-key reuse.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [session_state_conflict, action_key_conflict]}}}}
          example: {error: {code: session_state_conflict, message: Review the current session before starting another intent.}, request_id: 50000000-0000-4000-8000-000000000001}
    EnrollmentConflict:
      description: factor_exists, enrollment_pending, enrollment_expired or action_key_conflict. Expired pending enrollment requires a fresh key.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [factor_exists, enrollment_pending, enrollment_expired, action_key_conflict]}}}}
          example: {error: {code: enrollment_pending, message: Finish the pending enrollment or wait for its expiry.}, request_id: 50000000-0000-4000-8000-000000000001}
    ConfirmationConflict:
      description: enrollment_expired (also foreign/unknown enrollment), factor_exists, action_key_conflict or secret_delivery_expired.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [enrollment_expired, factor_exists, action_key_conflict, secret_delivery_expired]}}}}
          example: {error: {code: enrollment_expired, message: Start a new enrollment.}, request_id: 50000000-0000-4000-8000-000000000001}
    RotationConflict:
      description: recovery_set_conflict, action_key_conflict or secret_delivery_expired; no new codes committed by rejected request.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [recovery_set_conflict, action_key_conflict, secret_delivery_expired]}}}}
          example: {error: {code: recovery_set_conflict, message: Review current recovery-set status.}, request_id: 50000000-0000-4000-8000-000000000001}
    UnsupportedMedia:
      description: JSON body operations require application/json; no form credentials.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: unsupported_media_type}}}}
          example: {error: {code: unsupported_media_type, message: Use application/json.}, request_id: 50000000-0000-4000-8000-000000000001}
    CsrfMismatch:
      description: Missing/mismatched/stale CSRF proof; initialize CSRF, inspect session and review before resubmission.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: csrf_mismatch}}}}
          example: {error: {code: csrf_mismatch, message: Refresh browser CSRF protection.}, request_id: 50000000-0000-4000-8000-000000000001}
    InvalidInput:
      description: >-
        Well-formed JSON fails the specific request schema. Field pointers are RFC
        6901 relative to that operation body, including missing/unknown fields. No
        supplied values/proofs echoed. No key/proof consumed and no authority changed.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
          example:
            error:
              code: invalid_input
              message: Correct the indicated fields.
              fields: [{pointer: '', code: invalid_type, message: Request must be a JSON object.}]
            request_id: 50000000-0000-4000-8000-000000000001
    Throttled:
      description: Per trusted client IP and keyed account/session limits; failed proofs remain attempts, not business commits.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: throttled}}}}
          example: {error: {code: throttled, message: Try again after the indicated delay.}, request_id: 50000000-0000-4000-8000-000000000001}
    Unavailable:
      description: >-
        unavailable; no diagnostic SQL/secrets exposed. Outcome may be uncertain if
        commitment preceded response failure: inspect session/metadata before retry,
        never infer rollback from 503. Initialization can also fail before any write.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: unavailable}}}}
          example: {error: {code: unavailable, message: Authentication service is unavailable.}, request_id: 50000000-0000-4000-8000-000000000001}

    OpeningNotFound:
      description: Uniform current chapter/record visibility denial. An absent accepted action is operation_not_found,
        never proof of rollback during an in-flight attempt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      type: string
                      enum:
                      - chapter_not_found
                      - resource_not_found
                      - operation_not_found
    OpeningDenied:
      description: Current full session, origin, scoped duty or required independent counter is absent. No protected
        state or accepted action result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      type: string
                      enum:
                      - mfa_incomplete
                      - duty_denied
                      - origin_denied
                      - independence_required
    OpeningConflict:
      description: No partial source/stock/reference/result change. Preserve edits and reconcile authorized current
        state. Accepted replay precedes new-intent stale/lock checks.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      type: string
                      enum:
                      - version_conflict
                      - action_key_conflict
                      - snapshot_stale
                      - invalid_transition
                      - invalid_source
                      - source_incomplete
                      - source_not_authorized
                      - count_mismatch
                      - baseline_already_posted
                      - target_locked
                      - evidence_missing
                      - evidence_invalid
                      - evidence_mismatch
                      - acknowledgment_missing
    OpeningSetupBlocked:
      description: Missing/unapproved/non-effective required chapter inputs. Draft saving remains allowed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - error
            - request_id
            properties:
              error:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - blockers
                properties:
                  code:
                    const: setup_blocked
                  message:
                    type: string
                    minLength: 1
                    maxLength: 500
                  blockers:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/SetupBlocker'
              request_id:
                $ref: '#/components/schemas/Uuid'
    RfConflict:
      description: Rejected attempt, no partial mutation or accepted key. Only current permitted RF may be included;
        null for create/key conflicts without an admitted target. Inspect code/setup_blockers, retain input, refetch
        and explicitly review before a new intent.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RfConflict'
    RfDenied:
      description: Origin/MFA/current duty denial, or independence_required when the admitted requester is the approver.
        No protected record fields.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - origin_denied
                      - mfa_incomplete
                      - duty_denied
                      - independence_required
  examples:
    RecoveryDelivery:
      value:
