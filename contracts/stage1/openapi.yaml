        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/authenticator/enrollments:
    post:
      operationId: beginAuthenticatorEnrollment
      tags: [Authentication]
      x-existence: new
      summary: Prepare this account's first authenticator in the browser
      description: >-
        Allowed for enroll_authenticator continuation or a full password session with
        no enrolled factor. Current password is required in both cases. Never replace
        an enabled factor; administrative reset belongs to ticket 02. One unconfirmed
        enrollment per session/account; exact same-key retry returns the same pending
        secret until expiry. A different key while pending is enrollment_pending (409).
        RFC 6238 TOTP: SHA-1, 6 digits, 30-second step, +/- one step, reject accepted
        time-step reuse per account. Pending secret expires after 5 minutes, capped by
        continuation expiry. The URI is rendered locally as a QR code, not sent to a
        third-party QR service. Synthetic examples are not operational credentials.
      security: [{browserSession: [], csrfProof: []}]
