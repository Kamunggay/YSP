            - require_reenrollment
      - type: object
        required:
        - outcome
        - procedure_id
        - action_key
        - code
        - audit_id
        additionalProperties: false
        properties:
          outcome:
            const: rejected
          procedure_id:
            enum:
            - prepareAccount
            - setAccountStatus
            - prepareChapter
            - setMembership
            - setDuty
            - setAlternate
            - recordPolicy
            - resetMfa
          action_key:
            $ref: '#/components/schemas/Uuid'
          code:
            enum:
            - operator_denied
            - approval_required
            - identity_verification_required
            - invalid_input
            - version_conflict
            - action_key_conflict
            - setup_blocked
            - unavailable
          audit_id:
            $ref: '#/components/schemas/Uuid'
    DutyScope:
      type: object
      required:
      - unit_id
      - limit_php
      additionalProperties: false
      properties:
        unit_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Null is explicitly approved chapter-wide scope; otherwise this exact chapter-owned unit
            only.
        limit_php:
          oneOf:
          - type: string
            pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
          - type: 'null'
          description: Approved maximum for decisions needing monetary authority. Null supplies no monetary authority,
            never unlimited authority; nonfinancial duties may use null.
    CurrentDutyGrant:
      type: object
      required:
      - id
      - duty
      - scope
      - effective_from
      - effective_until
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        duty:
          $ref: '#/components/schemas/Duty'
