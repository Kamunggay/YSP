      required: [error, request_id]
      additionalProperties: false
      properties:
        request_id: {$ref: '#/components/schemas/Uuid'}
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
            message: {type: string, minLength: 1, maxLength: 500}
    ValidationError:
      type: object
      required: [error, request_id]
      additionalProperties: false
      properties:
        request_id: {$ref: '#/components/schemas/Uuid'}
        error:
          type: object
          required: [code, message, fields]
          additionalProperties: false
          properties:
            code: {const: invalid_input}
            message: {type: string, minLength: 1, maxLength: 500}
            fields:
              type: array
              minItems: 1
              items:
                type: object
                required: [pointer, code, message]
                additionalProperties: false
                properties:
                  pointer: {type: string, pattern: '^(/([^~/]|~[01])*)*$'}
                  code: {enum: [required, invalid_format, too_long, unexpected_field, invalid_type]}
                  message: {type: string, minLength: 1, maxLength: 200}
