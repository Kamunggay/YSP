        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/EnrollmentDenied'}
        '409': {$ref: '#/components/responses/ConfirmationConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
