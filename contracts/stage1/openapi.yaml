      type: object
      required: [state, user, authentication_method, mfa_required, authenticated_at, expires_at]
      additionalProperties: false
      properties:
        state: {const: authenticated}
        user: {$ref: '#/components/schemas/User'}
        authentication_method: {enum: [password, authenticator, recovery_code]}
        mfa_required: {type: boolean}
        authenticated_at: {$ref: '#/components/schemas/UtcInstant'}
        expires_at: {$ref: '#/components/schemas/UtcInstant'}
      allOf:
        - if:
            properties: {authentication_method: {const: password}}
          then:
            properties: {mfa_required: {const: false}}
    SessionResult:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          oneOf:
            - {$ref: '#/components/schemas/ContinuationSession'}
            - {$ref: '#/components/schemas/AuthenticatedSession'}
