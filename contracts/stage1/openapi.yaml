        rf_changes:
          type: array
          minItems: 0
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - rf_id
            - version
            - progress_version
            properties:
              rf_id:
                $ref: '#/components/schemas/Uuid'
              version:
                type: integer
                minimum: 1
                maximum: 2147483647
              progress_version:
                type: integer
                minimum: 1
                maximum: 2147483647
      allOf:
      - if:
          properties:
            operation_name:
              enum:
              - prepareRfReservation
        then:
          properties:
            resource_kind:
              const: preparation
            result:
              $ref: '#/components/schemas/ReservationPreparation'
      - if:
          properties:
            operation_name:
              enum:
              - commitRfReservation
              - releaseRfReservation
              - reallocateRfReservation
        then:
          properties:
            resource_kind:
              const: reservation
            result:
              $ref: '#/components/schemas/RfReservation'
      - if:
          properties:
            operation_name:
              enum:
              - placeStockHold
              - proposeStockHoldClearance
              - clearStockHold
        then:
          properties:
            resource_kind:
              const: hold
            result:
              $ref: '#/components/schemas/StockHold'
