            - {$ref: '#/components/schemas/ContinuationSession'}
            - allOf:
                - {$ref: '#/components/schemas/AuthenticatedSession'}
                - properties: {authentication_method: {const: password}}
    PasswordSignIn:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login:
          type: string
          format: email
          maxLength: 254
          description: Canonical login email; case-insensitive lookup. Not an opaque identity ID.
        password: {$ref: '#/components/schemas/Password'}
    EnrollmentRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: {$ref: '#/components/schemas/Password'}
    EnrollmentResult:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [enrollment_id, secret, provisioning_uri, expires_at]
          additionalProperties: false
          properties:
            enrollment_id: {$ref: '#/components/schemas/Uuid'}
            secret: {type: string, pattern: '^[A-Z2-7]{32,64}$', description: Sensitive pending seed with at least 160 random bits; no logs/storage in browser.}
            provisioning_uri: {type: string, format: uri, pattern: '^otpauth://totp/'}
            expires_at: {$ref: '#/components/schemas/UtcInstant'}
    EnrollmentConfirmation:
      type: object
      required: [enrollment_id, password, authenticator_code]
      additionalProperties: false
      properties:
        enrollment_id: {$ref: '#/components/schemas/Uuid'}
        password: {$ref: '#/components/schemas/Password'}
        authenticator_code: {$ref: '#/components/schemas/AuthenticatorCode'}
    AuthenticatorChallenge:
      type: object
      required: [authenticator_code]
      additionalProperties: false
      properties:
        authenticator_code: {$ref: '#/components/schemas/AuthenticatorCode'}
    RecoveryChallenge:
      type: object
      required: [recovery_code]
      additionalProperties: false
      properties:
        recovery_code: {$ref: '#/components/schemas/RecoveryCode'}
    RotateRecoveryCodes:
      type: object
      required: [password, authenticator_code, expected_recovery_set_id]
      additionalProperties: false
      properties:
        password: {$ref: '#/components/schemas/Password'}
        authenticator_code: {$ref: '#/components/schemas/AuthenticatorCode'}
        expected_recovery_set_id:
          oneOf:
            - {$ref: '#/components/schemas/Uuid'}
            - {type: 'null'}
    RecoverySetMetadata:
      type: object
      required: [id, remaining, created_at, expires_at]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        remaining: {type: integer, minimum: 0, maximum: 10}
        created_at: {$ref: '#/components/schemas/UtcInstant'}
        expires_at: {$ref: '#/components/schemas/UtcInstant'}
    RecoveryStatusResult:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [recovery_set]
          additionalProperties: false
          properties:
            recovery_set:
              oneOf:
                - {$ref: '#/components/schemas/RecoverySetMetadata'}
                - {type: 'null'}
    RecoverySetDelivery:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [session, recovery_set]
          additionalProperties: false
          properties:
            session:
              allOf:
                - {$ref: '#/components/schemas/AuthenticatedSession'}
                - properties: {authentication_method: {const: authenticator}}
            recovery_set:
              type: object
              required: [id, codes, created_at, expires_at]
              additionalProperties: false
              properties:
                id: {$ref: '#/components/schemas/Uuid'}
                codes:
                  type: array
                  minItems: 10
                  maxItems: 10
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/RecoveryCode'}
                created_at: {$ref: '#/components/schemas/UtcInstant'}
                expires_at: {$ref: '#/components/schemas/UtcInstant'}
    Error:
      type: object
      required: [error, request_id]
      additionalProperties: false
      properties:
        request_id: {$ref: '#/components/schemas/Uuid'}
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
            message: {type: string, minLength: 1, maxLength: 500}
    ValidationError:
      type: object
      required: [error, request_id]
      additionalProperties: false
      properties:
        request_id: {$ref: '#/components/schemas/Uuid'}
        error:
          type: object
          required: [code, message, fields]
          additionalProperties: false
          properties:
            code: {const: invalid_input}
            message: {type: string, minLength: 1, maxLength: 500}
            fields:
              type: array
              minItems: 1
              items:
                type: object
                required: [pointer, code, message]
                additionalProperties: false
                properties:
                  pointer: {type: string, pattern: '^(/([^~/]|~[01])*)*$'}
                  code: {enum: [required, invalid_format, too_long, unexpected_field, invalid_type]}
                  message: {type: string, minLength: 1, maxLength: 200}
  responses:
    ChapterAccessDenied:
      description: mfa_incomplete for limited authentication; duty_denied for a visible chapter with insufficient
        duty. No protected state is returned
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - mfa_incomplete
                      - duty_denied
          example:
            error:
              code: mfa_incomplete
              message: mfa_incomplete for limited authentication; duty_denied for a visible chapter with insufficient
                duty.
            request_id: 50000000-0000-4000-8000-000000000001
    ChapterUnavailable:
      description: chapter_not_found uniformly for unknown, inactive, foreign or revoked chapter membership, including
        a provider without membership. No chapter existence or name disclosed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - chapter_not_found
          example:
            error:
              code: chapter_not_found
              message: chapter_not_found uniformly for unknown, inactive, foreign or revoked chapter membership,
                including a provider without membership.
            request_id: 50000000-0000-4000-8000-000000000001
    InvalidSelector:
      description: invalid_selector for unknown/repeated/malformed query, malformed chapter UUID after admission
        or mismatched cursor
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - invalid_selector
          example:
            error:
              code: invalid_selector
              message: invalid_selector for unknown/repeated/malformed query, malformed chapter UUID after admission
                or mismatched cursor.
            request_id: 50000000-0000-4000-8000-000000000001
    AuthoritySnapshotStale:
      description: snapshot_stale for expired cursor or changed membership/authority snapshot. Restart listing;
        never return removed authority
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - snapshot_stale
          example:
            error:
              code: snapshot_stale
              message: snapshot_stale for expired cursor or changed membership/authority snapshot.
            request_id: 50000000-0000-4000-8000-000000000001
    SessionEstablished:
      description: Password accepted; inspect state/next_step, not just HTTP 200.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PasswordSignInResult'}
          example:
            data:
              state: continuation
              user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
              next_step: challenge_authenticator
              expires_at: '2026-11-08T02:10:00.000000Z'
    AuthenticatorCompleted:
      description: MFA complete; no chapter authority is created. Re-read current authority before business access.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/MfaSessionResult'}
              - properties: {data: {properties: {authentication_method: {const: authenticator}}}}
          examples:
            authenticator:
              value:
                data:
                  state: authenticated
                  user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
                  authentication_method: authenticator
                  mfa_required: true
                  authenticated_at: '2026-11-08T02:02:00.000000Z'
                  expires_at: '2026-11-08T04:02:00.000000Z'
    RecoveryCompleted:
      description: Recovery proof consumed once; identity restored without adding chapter authority.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/MfaSessionResult'}
              - properties: {data: {properties: {authentication_method: {const: recovery_code}}}}
          example:
            data:
              state: authenticated
              user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
              authentication_method: recovery_code
              mfa_required: true
              authenticated_at: '2026-11-08T02:02:00.000000Z'
              expires_at: '2026-11-08T04:02:00.000000Z'
    RecoverySetDelivered:
      description: Sensitive rotated recovery set; bounded delivery replay. Session cookies do not change.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecoverySetDelivery'}
          examples:
            delivered: {$ref: '#/components/examples/RecoveryDelivery'}
    InitialRecoverySetDelivered:
      description: >-
        Sensitive initial recovery set. Confirmation rotates both cookies; bounded
        same-key delivery replay synchronizes current cookies without another rotation.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie: {$ref: '#/components/headers/SessionCookies'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecoverySetDelivery'}
          examples:
            delivered: {$ref: '#/components/examples/RecoveryDelivery'}
    BadRequest:
      description: malformed_request for malformed JSON, forbidden query/body, missing/malformed action key or duplicate selectors.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: malformed_request}}}}
          example: {error: {code: malformed_request, message: Invalid request syntax.}, request_id: 50000000-0000-4000-8000-000000000001}
    InvalidCredentials:
      description: Unknown/disabled account or incorrect password, without distinguishing which.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: invalid_credentials}}}}
          example: {error: {code: invalid_credentials, message: Sign-in failed.}, request_id: 50000000-0000-4000-8000-000000000001}
    Unauthenticated:
      description: Missing/expired/revoked/disabled session or expired continuation; restart password sign-in.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: unauthenticated}}}}
          example: {error: {code: unauthenticated, message: Sign in again.}, request_id: 50000000-0000-4000-8000-000000000001}
    OriginDenied:
      description: origin_denied for missing/null/foreign Origin on unsafe requests, or foreign CSRF initialization.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: origin_denied}}}}
          example: {error: {code: origin_denied, message: Browser origin denied.}, request_id: 50000000-0000-4000-8000-000000000001}
    EnrollmentDenied:
      description: origin_denied, continuation_mismatch or invalid_factor (wrong password/TOTP); no factor information leaked.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [origin_denied, continuation_mismatch, invalid_factor]}}}}
          example: {error: {code: invalid_factor, message: Authentication proof was not accepted.}, request_id: 50000000-0000-4000-8000-000000000001}
    ChallengeDenied:
      description: origin_denied, continuation_mismatch or invalid_factor (invalid/expired/consumed/superseded factor, uniformly).
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [origin_denied, continuation_mismatch, invalid_factor]}}}}
          example: {error: {code: invalid_factor, message: Authentication proof was not accepted.}, request_id: 50000000-0000-4000-8000-000000000001}
    FullSessionRequired:
      description: mfa_incomplete for continuation; factor_not_enrolled for password-only full session without factor.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [mfa_incomplete, factor_not_enrolled]}}}}
          example: {error: {code: mfa_incomplete, message: Complete multifactor authentication first.}, request_id: 50000000-0000-4000-8000-000000000001}
    RecoveryRotationDenied:
      description: origin_denied, mfa_incomplete, factor_not_enrolled or invalid_factor (fresh password/TOTP failed).
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [origin_denied, mfa_incomplete, factor_not_enrolled, invalid_factor]}}}}
          example: {error: {code: invalid_factor, message: Authentication proof was not accepted.}, request_id: 50000000-0000-4000-8000-000000000001}
    SessionConflict:
      description: session_state_conflict for a new intent from wrong session state, or action_key_conflict for different-payload accepted-key reuse.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [session_state_conflict, action_key_conflict]}}}}
          example: {error: {code: session_state_conflict, message: Review the current session before starting another intent.}, request_id: 50000000-0000-4000-8000-000000000001}
    EnrollmentConflict:
      description: factor_exists, enrollment_pending, enrollment_expired or action_key_conflict. Expired pending enrollment requires a fresh key.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [factor_exists, enrollment_pending, enrollment_expired, action_key_conflict]}}}}
          example: {error: {code: enrollment_pending, message: Finish the pending enrollment or wait for its expiry.}, request_id: 50000000-0000-4000-8000-000000000001}
    ConfirmationConflict:
      description: enrollment_expired (also foreign/unknown enrollment), factor_exists, action_key_conflict or secret_delivery_expired.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [enrollment_expired, factor_exists, action_key_conflict, secret_delivery_expired]}}}}
          example: {error: {code: enrollment_expired, message: Start a new enrollment.}, request_id: 50000000-0000-4000-8000-000000000001}
    RotationConflict:
      description: recovery_set_conflict, action_key_conflict or secret_delivery_expired; no new codes committed by rejected request.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {enum: [recovery_set_conflict, action_key_conflict, secret_delivery_expired]}}}}
          example: {error: {code: recovery_set_conflict, message: Review current recovery-set status.}, request_id: 50000000-0000-4000-8000-000000000001}
    UnsupportedMedia:
      description: JSON body operations require application/json; no form credentials.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: unsupported_media_type}}}}
          example: {error: {code: unsupported_media_type, message: Use application/json.}, request_id: 50000000-0000-4000-8000-000000000001}
    CsrfMismatch:
      description: Missing/mismatched/stale CSRF proof; initialize CSRF, inspect session and review before resubmission.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: csrf_mismatch}}}}
          example: {error: {code: csrf_mismatch, message: Refresh browser CSRF protection.}, request_id: 50000000-0000-4000-8000-000000000001}
    InvalidInput:
      description: >-
        Well-formed JSON fails the specific request schema. Field pointers are RFC
        6901 relative to that operation body, including missing/unknown fields. No
        supplied values/proofs echoed. No key/proof consumed and no authority changed.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
          example:
            error:
              code: invalid_input
              message: Correct the indicated fields.
              fields: [{pointer: '', code: invalid_type, message: Request must be a JSON object.}]
            request_id: 50000000-0000-4000-8000-000000000001
    Throttled:
      description: Per trusted client IP and keyed account/session limits; failed proofs remain attempts, not business commits.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: throttled}}}}
          example: {error: {code: throttled, message: Try again after the indicated delay.}, request_id: 50000000-0000-4000-8000-000000000001}
    Unavailable:
      description: >-
        unavailable; no diagnostic SQL/secrets exposed. Outcome may be uncertain if
        commitment preceded response failure: inspect session/metadata before retry,
        never infer rollback from 503. Initialization can also fail before any write.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {error: {properties: {code: {const: unavailable}}}}
          example: {error: {code: unavailable, message: Authentication service is unavailable.}, request_id: 50000000-0000-4000-8000-000000000001}

  examples:
    RecoveryDelivery:
      value:
        data:
          session:
            state: authenticated
            user: {id: 10000000-0000-4000-8000-000000000001, display_name: Synthetic approver}
            authentication_method: authenticator
            mfa_required: true
            authenticated_at: '2026-11-08T02:02:00.000000Z'
            expires_at: '2026-11-08T04:02:00.000000Z'
          recovery_set:
            id: 30000000-0000-4000-8000-000000000001
            codes:
              - ABCD-EFGH-JKLM-NPQR
              - BBCD-EFGH-JKLM-NPQR
              - CBCD-EFGH-JKLM-NPQR
              - DBCD-EFGH-JKLM-NPQR
              - EBCD-EFGH-JKLM-NPQR
              - FBCD-EFGH-JKLM-NPQR
              - GBCD-EFGH-JKLM-NPQR
              - HBCD-EFGH-JKLM-NPQR
              - IBCD-EFGH-JKLM-NPQR
              - JBCD-EFGH-JKLM-NPQR
            created_at: '2026-11-08T02:02:00.000000Z'
            expires_at: '2027-11-08T02:02:00.000000Z'

