- name: failed-command
  http_cases:
  - reservation-exact-ten-only-six-zero-commit
  events: []
  expectation: Exact-ten reservation with only6 rejects and creates no domain intent/event; same holds for failed
    source/evidence/stale/hold-first issue. Existing authoritative state and unsaved exact-ten input remain.
- name: duplicate-or-delayed
  http_cases:
  - notifications09-refresh-readInternalRf
  events:
  - stage1.internal-rf.changed.v1
  expectation: 'Deliver same event_id twice, then an older version after a newer one: deduplicate/invalidate as
    needed; current GET wins. Never decrement versions, reservations or stock from notice ordering; no command is
    invoked.'
- name: missed-event-reconnect
  http_cases:
  - notifications09-session-authorized
  - notifications09-chapter-authorized
  - notifications09-refresh-readCurrentSession
  - notifications09-refresh-listMyChapterMemberships
  - notifications09-refresh-readChapterContext
  - notifications09-refresh-readChapterAccess
  - notifications09-refresh-readInternalRf
  - notifications09-refresh-readActualIssue
  - notifications09-refresh-findActualIssueOperation
  - notifications09-refresh-readVariantStock
  - notifications09-refresh-readRfReservation
  - notifications09-refresh-readStockLot
  events: []
  expectation: Subscribe and acknowledge first, buffer notices, current authority then permitted mounted/list/pending-result
    reads; drain dirty subjects with another GET. A dropped notice is covered by complete current resync, with existing
    uncertain action key kept private. No replay cursor, posting or physical handover. All joined notice and current-read
    identities/versions refer to the first committed4 at03:09Z, with onhand8/reserved2/available6 and RF issued4.
  notice_examples:
  - internal-rf-committed
  - rf-reservation-committed
  - actual-issue-committed
  - stock-lot-committed
- name: chapter-change
  http_cases:
  - notifications09-refresh-readChapterContext
  - notifications09-refresh-readChapterAccess
  - notifications09-chapter-copied-channel
  events: []
  expectation: Cancel old generation reads/handlers, leave old chapter socket subscription, retain draft(user,origin
    chapter,resource,base material) separately. Explicitly select admitted new chapter, authorize its new channel
    and refresh. Ignore late old-chapter GET/event responses. Never relabel or submit the retained draft to the
    new chapter.
- name: revocation
  http_cases:
  - notifications09-chapter-revoked
  - notifications09-old-result-revoked
  events:
  - stage1.authority.changed.v1
  expectation: Membership/duty revocation invalidates current server delivery scopes before any subsequent dispatch;
    close affected subscriptions. Lost control notice cannot preserve access. Refetch current authority, remove
    newly forbidden protected outputs and stop commands; older committed result remains committed but now denied.
- name: disabled-or-other-user
  http_cases:
  - notifications09-disabled-session
  - notifications09-session-copied-channel
  events: []
  expectation: Server disconnects all disabled user sessions. Purge protected cache and identity-bound edit buffers
    on sign-out/disable/identity replacement. An expired session may retain an inaccessible same-person buffer until
    identity is verified; another user never sees it. No cross-user storage or automatic restoration.
- name: preserved-edit
  http_cases:
  - notifications09-refresh-readInternalRf
  events:
  - stage1.internal-rf.changed.v1
  expectation: 'Same enabled user, same permitted chapter: retain unsaved line quantity and original base material
    version. Stage newer server state beside the edit; show stale/conflict and require explicit comparison/reconfirmation.
    A current GET cannot overwrite the form or turn a failed attempt into automatic reservation/issue.'
