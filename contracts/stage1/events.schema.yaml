- $ref: '#/$defs/chapter-setup'
- $ref: '#/$defs/catalogue-item'
- $ref: '#/$defs/catalogue-variant'
- $ref: '#/$defs/catalogue-unit'
- $ref: '#/$defs/catalogue-location'
