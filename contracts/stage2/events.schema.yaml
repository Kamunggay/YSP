- $ref: '#/$defs/purchase-order'
- $ref: '#/$defs/donation'
- $ref: '#/$defs/receiving-report'
- $ref: '#/$defs/receiving-discrepancy'
- $ref: '#/$defs/receiving-hold'
$defs:
