  - name: stage2-02-repf-so-shortage-rejected
    operationId: createRepf
    request_valid: false
    before: Stage 2 strictly rejects so_shortage RepF triggers so unpaid Sales Orders cannot bypass Stage 3 OR funding (PRC-01).
    request:
      headers:
        X-Action-Key: 40000000-0000-4000-8000-000000000220
      path:
        chapter_id: 60000000-0000-4000-8000-000000000001
      body:
        funding_source: chapter_funds
        urgency: urgent
        justification: Attempted Stage 3 Sales Order shortage trigger in Stage 2.
        lines:
          - trigger_kind: so_shortage
            variant_id: 95000000-0000-4000-8000-000000000051
            unit_id: 95000000-0000-4000-8000-000000000052
            rf_id: null
            rf_line_id: null
            requested_quantity: '5'
            estimated_unit_cost_php: '250.00'
            needed_by: null
            additional_purchase_reason: null
            notes: null
    response:
      status: '422'
      body:
        request_id: 50000000-0000-4000-8000-000000000220
        error:
          code: invalid_input
          message: Correct the indicated RepF fields.
          fields:
            - pointer: /lines/0/trigger_kind
              code: invalid_format
              message: Stage 2 RepF lines accept only rf_shortage or rop_replenishment triggers.

  - name: stage2-02-repf-hold-missing-reason-invalid
    operationId: reviewRepfBudget
    request_valid: false
