  - name: stage2-01-missing-rop-target-setup-blocked
    operationId: listReplenishmentNeeds
    before: >-
      Explicit rop_breach query for an item lacking effective rop and with expired
      target_level returns 409 setup_blocked naming exact SetupBlocker records (GOV-09).
    request:
      path:
        chapter_id: 60000000-0000-4000-8000-000000000001
      query:
        item_id: 95000000-0000-4000-8000-000000000060
        trigger_filter: rop_breach
    response:
      status: '409'
      body:
        request_id: 50000000-0000-4000-8000-000000000201
        error:
          code: setup_blocked
          message: Required ROP and target stock level policies are not effective for the requested item.
          blockers:
            - setting_key: rop
              subject_id: 95000000-0000-4000-8000-000000000060
              state: missing
              approval_owner: CHAPTER_HEAD
              message: Effective approved rop policy is required for ROP replenishment evaluation.
            - setting_key: target_level
              subject_id: 95000000-0000-4000-8000-000000000060
              state: expired
              approval_owner: CHAPTER_HEAD
              message: Effective approved target_level policy expired and must be renewed via recordPolicy.

  - name: stage2-01-unauthorized-duty-denied
    operationId: listReplenishmentNeeds
    before: >-
      Authenticated chapter member holding only COMMITTEE_REQUESTER lacks replenishment.read
      duty and receives 403 duty_denied without disclosing stock or policy details.
    request:
      path:
        chapter_id: 60000000-0000-4000-8000-000000000001
    response:
      status: '403'
      body:
        request_id: 50000000-0000-4000-8000-000000000202
        error:
          code: duty_denied
          message: Current chapter duties do not authorize replenishment.read.

  - name: stage2-01-stale-cursor
    operationId: listReplenishmentNeeds
    before: >-
      Cursor exceeds its 5-minute snapshot window or underlying stock/demand changed ->
      409 snapshot_stale requiring restart from page 1 with preserved filters.
    request:
      path:
        chapter_id: 60000000-0000-4000-8000-000000000001
      query:
        cursor: synthetic-expired-replenishment-cursor
        limit: 25
    response:
      status: '409'
      body:
        request_id: 50000000-0000-4000-8000-000000000203
        error:
          code: snapshot_stale
          message: Replenishment snapshot cursor expired or underlying state changed; restart from the first page.

