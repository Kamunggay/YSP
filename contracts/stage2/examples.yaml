    request:
      headers:
        X-Action-Key: 40000000-0000-4000-8000-000000000221
      path:
        chapter_id: 60000000-0000-4000-8000-000000000001
        repf_id: 90000000-0000-4000-8000-000000000010
      body:
        expected_version: 3
        expected_material_version: 2
        decision: hold
        reason: null
    response:
      status: '422'
      body:
        request_id: 50000000-0000-4000-8000-000000000221
        error:
          code: invalid_input
          message: Correct the indicated budget review fields.
          fields:
            - pointer: /reason
              code: required
              message: A non-blank reason is mandatory for hold, return, and reject decisions.

  - name: stage2-02-repf-duplicate-supply-coverage-conflict
    operationId: submitRepf
    before: >-
      Submitting a line requesting 10 units when live uncovered_need is 5 without
      additional_purchase_reason returns 409 duplicate_supply_coverage naming covering
      inbound sources (INV-12).
    request:
      headers:
        X-Action-Key: 40000000-0000-4000-8000-000000000222
      path:
        chapter_id: 60000000-0000-4000-8000-000000000001
        repf_id: 90000000-0000-4000-8000-000000000010
      body:
        expected_version: 1
        expected_material_version: 1
    response:
      status: '409'
      body:
        request_id: 50000000-0000-4000-8000-000000000222
        error:
          code: duplicate_supply_coverage
          message: Requested quantity exceeds live uncovered need; supply an explicit additional_purchase_reason or reduce quantity.
        failed_intent_committed: false
        current: null
        setup_blockers: []
        coverage_conflicts:
          - line_index: 0
            trigger_kind: rf_shortage
            variant_id: 95000000-0000-4000-8000-000000000051
            requested_quantity: '10'
            live_uncovered_need: '5'
            variant_proposed_uncovered_quantity: '55'
            blocking_inbound_sources:
              - source_kind: po
                source_id: 91000000-0000-4000-8000-000000000010
                source_reference: CEB-PO-2026-000004
                status: partially_received
                open_quantity: '10'
                coverage_state: counted
                exclusion_reason: null

