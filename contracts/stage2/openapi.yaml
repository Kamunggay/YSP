      x-owner: Leader
      x-existence: new
      x-required-action: da.history_read
      summary: List immutable DA history
      description: Newest version first. Also requires current history.read and applicable evidence.read. Cursor binds
        the current authorized history snapshot.
      security:
      - browserSession: []
      parameters:
      - {$ref: '#/components/parameters/ChapterId'}
      - {$ref: '#/components/parameters/DonationId'}
      - {$ref: '#/components/parameters/PageLimit'}
      - {$ref: '#/components/parameters/SnapshotCursor'}
      responses:
        '200':
          description: Authorized DA read.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationHistoryList'}
        '400': {$ref: '#/components/responses/InvalidSelector'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ChapterAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/DonationSnapshotStale'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chapters/{chapter_id}/donations/{da_id}/versions/{version}:
    get:
      operationId: readDonationVersion
      tags:
      - Donations
      x-owner: Leader
      x-existence: new
