                  - draft
                  - pending_approval
                  - returned_for_revision
                  - rejected
          then:
            properties:
              po_reference:
                type: 'null'
              approved_by:
                type: 'null'
              approved_at:
                type: 'null'
              issued_at:
                type: 'null'
              acknowledgment:
                type: 'null'
              pending_amendment:
                type: 'null'
        - if:
            properties:
              status:
                enum:
                  - issued
                  - partially_received
                  - receiving_complete
                  - closed_short
          then:
            properties:
              po_reference:
                type: string
              approved_by:
                $ref: '#/components/schemas/ProcurementActor'
              approved_at:
                $ref: '#/components/schemas/UtcInstant'
              issued_at:
                $ref: '#/components/schemas/UtcInstant'
        - if:
            properties:
              status:
                enum:
                  - returned_for_revision
                  - rejected
          then:
            properties:
              review_decision_reason:
                type: string
        - if:
            properties:
              status:
                const: receiving_complete
          then:
            properties:
              pending_amendment:
                type: 'null'
        - if:
            properties:
              status:
                const: closed_short
          then:
            properties:
              closed_short_by:
                $ref: '#/components/schemas/ProcurementActor'
              closed_short_at:
                $ref: '#/components/schemas/UtcInstant'
              close_short_reason:
                type: string
              pending_amendment:
                type: 'null'
        - if:
            properties:
              status:
                const: canceled
          then:
            properties:
              canceled_by:
                $ref: '#/components/schemas/ProcurementActor'
              canceled_at:
                $ref: '#/components/schemas/UtcInstant'
              cancel_reason:
                type: string
              pending_amendment:
                type: 'null'
