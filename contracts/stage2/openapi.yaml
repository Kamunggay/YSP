    requirement: RPT-05
    deferred_to: Stages 3-4
    rationale: >-
      Sales Invoices, Official Receipts, payment allocations, booth custody/sales,
      and cash/remittance reconciliations do not exist in Stage 2. No /reports/finance
      or /reports/booth routes are exposed in Stage 2.
  binary_pdf_csv_exports:
