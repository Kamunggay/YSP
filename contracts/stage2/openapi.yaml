                $ref: '#/components/schemas/UtcInstant'

    # --- Net-Shortage & ROP Replenishment Schemas (Glenn) ---
    PolicyBindingRef:
      type: object
      additionalProperties: false
      required:
        - policy_id
        - version
      properties:
        policy_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
    ReplenishmentRfShortageLine:
      type: object
      additionalProperties: false
      required:
        - rf_id
        - rf_reference
        - rf_line_id
        - rf_material_version
        - requesting_unit_id
        - needed_at
        - approved_quantity
        - issued_quantity
        - canceled_quantity
        - active_reserved_quantity
        - unreserved_outstanding_quantity
      properties:
        rf_id:
          $ref: '#/components/schemas/Uuid'
        rf_reference:
          type: string
          minLength: 1
          maxLength: 80
        rf_line_id:
          $ref: '#/components/schemas/Uuid'
        rf_material_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        requesting_unit_id:
          $ref: '#/components/schemas/Uuid'
        needed_at:
          $ref: '#/components/schemas/UtcInstant'
        approved_quantity:
          $ref: '#/components/schemas/StockQuantity'
        issued_quantity:
          $ref: '#/components/schemas/StockQuantity'
        canceled_quantity:
          $ref: '#/components/schemas/StockQuantity'
        active_reserved_quantity:
          $ref: '#/components/schemas/StockQuantity'
        unreserved_outstanding_quantity:
          $ref: '#/components/schemas/StockQuantity'
    ReplenishmentInboundSource:
      type: object
      additionalProperties: false
      required:
        - source_kind
        - source_id
        - source_reference
        - status
        - open_quantity
        - coverage_state
        - exclusion_reason
      properties:
        source_kind:
          type: string
          enum:
            - repf
            - po
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_reference:
          type: string
          minLength: 1
          maxLength: 80
          description: Allocated chapter REPF (post-submit) or PO (post-approval/issued) reference.
        status:
          type: string
          enum:
            - pending_budget_review
            - held
            - approved
            - partially_ordered
            - issued
            - partially_received
        open_quantity:
          $ref: '#/components/schemas/StockQuantity'
        coverage_state:
          type: string
          enum:
            - counted
            - late
            - disputed
            - ineligible
        exclusion_reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'
      allOf:
        - if:
            properties:
              source_kind:
                const: repf
          then:
            properties:
              status:
                enum:
                  - pending_budget_review
                  - held
                  - approved
                  - partially_ordered
          else:
            properties:
              status:
                enum:
                  - issued
                  - partially_received
        - if:
            properties:
              coverage_state:
                const: counted
          then:
            properties:
              exclusion_reason:
                type: 'null'
          else:
            properties:
              exclusion_reason:
                type: string
    ReplenishmentNeedItem:
      type: object
      additionalProperties: false
      required:
        - chapter_id
        - item_id
        - item_code
        - variant_id
        - variant_code
        - display_name
        - unit_id
        - unit_code
        - quantity_scale
        - approved_rop
        - rop_policy
        - approved_target_level
        - target_level_policy
        - usable_stockroom_on_hand
        - eligible_usable_stockroom_on_hand
        - active_rf_reservations
        - eligible_available_to_allocate
        - total_unreserved_approved_rf_demand
        - unreserved_approved_rf_shortage
        - open_repf_quantity
        - open_po_inbound_quantity
        - total_open_inbound_coverage
        - excluded_inbound_quantity
        - low_stock_breach
        - gross_rf_shortage_need
        - gross_rop_replenishment_need
        - gross_combined_need
        - uncovered_rf_shortage_quantity
        - uncovered_rop_replenishment_quantity
        - proposed_uncovered_quantity
        - contributing_rf_lines
        - inbound_sources
        - setup_blockers
        - observed_at
      properties:
        chapter_id:
          $ref: '#/components/schemas/Uuid'
        item_id:
          $ref: '#/components/schemas/Uuid'
        item_code:
          $ref: '#/components/schemas/CatalogueCode'
        variant_id:
          $ref: '#/components/schemas/Uuid'
        variant_code:
          $ref: '#/components/schemas/CatalogueCode'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        unit_id:
          $ref: '#/components/schemas/Uuid'
        unit_code:
          $ref: '#/components/schemas/CatalogueCode'
        quantity_scale:
          type: integer
          minimum: 0
          maximum: 6
        approved_rop:
          oneOf:
            - $ref: '#/components/schemas/StockQuantity'
            - type: 'null'
        rop_policy:
          oneOf:
            - $ref: '#/components/schemas/PolicyBindingRef'
            - type: 'null'
        approved_target_level:
          oneOf:
            - $ref: '#/components/schemas/StockQuantity'
            - type: 'null'
        target_level_policy:
          oneOf:
            - $ref: '#/components/schemas/PolicyBindingRef'
            - type: 'null'
        usable_stockroom_on_hand:
          $ref: '#/components/schemas/StockQuantity'
          description: Matches Stage 1 SevenStockViews.usable_stockroom_on_hand; compared against approved_rop for low_stock_breach (INV-10).
        eligible_usable_stockroom_on_hand:
          $ref: '#/components/schemas/StockQuantity'
          description: Usable stockroom on-hand eligible for internal demand (excluding active StockHolds and uninterpreted/ineligible restricted lots).
        active_rf_reservations:
          $ref: '#/components/schemas/StockQuantity'
        eligible_available_to_allocate:
          $ref: '#/components/schemas/StockQuantity'
          description: max(0, eligible_usable_stockroom_on_hand - active_rf_reservations).
        total_unreserved_approved_rf_demand:
          $ref: '#/components/schemas/StockQuantity'
          description: Sum of unreserved_outstanding_quantity across approved pending internal RF lines for this variant.
        unreserved_approved_rf_shortage:
          $ref: '#/components/schemas/StockQuantity'
          description: max(0, total_unreserved_approved_rf_demand - eligible_available_to_allocate).
        open_repf_quantity:
          $ref: '#/components/schemas/StockQuantity'
          description: Un-ordered open quantity across active chapter RepFs counted as covering inbound (INV-12).
        open_po_inbound_quantity:
          $ref: '#/components/schemas/StockQuantity'
          description: Unreceived open quantity across issued/partially_received POs counted as covering inbound (INV-12).
        total_open_inbound_coverage:
          $ref: '#/components/schemas/StockQuantity'
          description: open_repf_quantity + open_po_inbound_quantity (excludes late, disputed, or ineligible supply).
        excluded_inbound_quantity:
          $ref: '#/components/schemas/StockQuantity'
          description: Open supply flagged late, disputed, or ineligible and therefore excluded from duplicate-coverage deduction (INV-12).
        low_stock_breach:
          type: boolean
          description: True iff approved_rop is effective and usable_stockroom_on_hand <= approved_rop (INV-10).
        gross_rf_shortage_need:
          $ref: '#/components/schemas/StockQuantity'
          description: Equals unreserved_approved_rf_shortage.
        gross_rop_replenishment_need:
          $ref: '#/components/schemas/StockQuantity'
          description: Non-overlapping ROP top-up portion above post-RF stock up to approved_target_level when low_stock_breach is true and approved_target_level is effective; 0 otherwise (INV-11).
        gross_combined_need:
          $ref: '#/components/schemas/StockQuantity'
          description: gross_rf_shortage_need + gross_rop_replenishment_need without double-counting overlapping stock or demand.
        uncovered_rf_shortage_quantity:
          $ref: '#/components/schemas/StockQuantity'
          description: max(0, gross_rf_shortage_need - total_open_inbound_coverage).
        uncovered_rop_replenishment_quantity:
          $ref: '#/components/schemas/StockQuantity'
          description: max(0, gross_rop_replenishment_need - max(0, total_open_inbound_coverage - gross_rf_shortage_need)).
        proposed_uncovered_quantity:
          $ref: '#/components/schemas/StockQuantity'
          description: uncovered_rf_shortage_quantity + uncovered_rop_replenishment_quantity = max(0, gross_combined_need - total_open_inbound_coverage).
        contributing_rf_lines:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReplenishmentRfShortageLine'
        inbound_sources:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReplenishmentInboundSource'
        setup_blockers:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/SetupBlocker'
        observed_at:
          $ref: '#/components/schemas/UtcInstant'
      allOf:
        - if:
            properties:
              approved_rop:
                type: 'null'
          then:
            properties:
              rop_policy:
                type: 'null'
              low_stock_breach:
                const: false
          else:
            properties:
              rop_policy:
                $ref: '#/components/schemas/PolicyBindingRef'
        - if:
            properties:
              approved_target_level:
                type: 'null'
          then:
            properties:
              target_level_policy:
                type: 'null'
          else:
            properties:
              target_level_policy:
                $ref: '#/components/schemas/PolicyBindingRef'
    ReplenishmentNeedList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReplenishmentNeedItem'
        page:
          $ref: '#/components/schemas/Page'

    # --- Internal Synchronous Participant: Glenn computeNetShortageSnapshot ---
    ComputeNetShortageSnapshotInput:
      type: object
      additionalProperties: false
      required:
        - chapter_id
        - actor_id
        - observed_at
        - variant_ids
        - include_rf_line_breakdown
        - require_rop_and_target_policies
        - exclude_repf_id
      properties:
        chapter_id:
          $ref: '#/components/schemas/Uuid'
        actor_id:
          $ref: '#/components/schemas/Uuid'
        observed_at:
          $ref: '#/components/schemas/UtcInstant'
        variant_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
          description: >-
            Bounded batch (1..100) of active chapter variant IDs. listReplenishmentNeeds
            resolves the snapshot-paginated page of variant IDs (up to limit <= 100)
            before calling this participant; Leader RepF writes pass the RepF's exact
            line variant IDs.
        include_rf_line_breakdown:
          type: boolean
        require_rop_and_target_policies:
          type: boolean
          description: When true, missing or expired ROP or target_level policy for any requested variant yields outcome setup_blocked.
        exclude_repf_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Optional RepF ID excluded from open_repf_quantity when Leader re-evaluates an existing RepF during replace/submit/review.
    ComputeNetShortageSnapshotResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - outcome
            - snapshot_version
            - observed_at
            - items
          properties:
            outcome:
              const: ready
            snapshot_version:
              type: integer
              minimum: 1
              maximum: 2147483647
            observed_at:
              $ref: '#/components/schemas/UtcInstant'
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ReplenishmentNeedItem'
        - type: object
          additionalProperties: false
          required:
            - outcome
            - blockers
          properties:
            outcome:
              const: setup_blocked
            blockers:
              type: array
              minItems: 1
              maxItems: 50
              items:
                $ref: '#/components/schemas/SetupBlocker'
        - type: object
          additionalProperties: false
          required:
            - outcome
            - code
            - message
          properties:
            outcome:
              const: rejected
            code:
              type: string
              enum:
                - chapter_not_found
                - resource_not_found
                - unit_mismatch
                - unavailable
            message:
              type: string
              minLength: 1
              maxLength: 500

    # --- RepF Intake, Duplicate-Coverage Guard & Budget Review Schemas (Leader) ---
    PositiveStockQuantity:
      allOf:
        - $ref: '#/components/schemas/StockQuantity'
        - not:
            pattern: '^0(\.0+)?$'
      description: Strictly positive canonical decimal quantity string matching exact approved variant scale (0 to 6).
    RepfStatus:
      type: string
      enum:
        - draft
        - pending_budget_review
        - approved
        - held
        - returned_for_revision
        - rejected
        - partially_ordered
        - ordered
        - canceled
    RepfTriggerKind:
      type: string
      enum:
        - rf_shortage
        - rop_replenishment
      description: Stage 2 RepF trigger kinds strictly exclude Stage 3 so_shortage (PRC-01).
    RepfUrgency:
      type: string
      enum:
        - normal
        - urgent
        - critical
    RepfBudgetDecision:
      type: string
      enum:
        - approve
        - hold
        - return
        - reject
    RepfHistoryAction:
      type: string
      enum:
        - createRepf
        - replaceRepf
        - submitRepf
        - approveRepf
        - holdRepf
        - returnRepf
        - rejectRepf
        - resumeRepfReview
        - reviseRepf
        - cancelRepf
        - po_ordered_progress
        - linked_demand_canceled
    ProcurementActor:
      type: object
      additionalProperties: false
      required:
        - user_id
        - display_name
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
    AdditionalPurchaseReason:
      type: object
      additionalProperties: false
      required:
        - category
        - referenced_source_ids
        - explanation
      properties:
        category:
          type: string
          enum:
            - late_supply
            - disputed_supply
            - ineligible_supply
        referenced_source_ids:
          type: array
          minItems: 0
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
          description: Optional IDs of open RepF/PO sources that are late, disputed, or ineligible.
        explanation:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
      description: Explicit INV-12 justification required whenever requested_quantity exceeds live uncovered_need.
    RepfLineInput:
      type: object
      additionalProperties: false
      required:
        - trigger_kind
        - variant_id
        - unit_id
        - rf_id
        - rf_line_id
        - requested_quantity
        - estimated_unit_cost_php
        - needed_by
        - additional_purchase_reason
        - notes
      properties:
        trigger_kind:
          $ref: '#/components/schemas/RepfTriggerKind'
        variant_id:
          $ref: '#/components/schemas/Uuid'
        unit_id:
          $ref: '#/components/schemas/Uuid'
        rf_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        rf_line_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        requested_quantity:
          $ref: '#/components/schemas/PositiveStockQuantity'
        estimated_unit_cost_php:
          $ref: '#/components/schemas/PhpAmount'
        needed_by:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        additional_purchase_reason:
          oneOf:
            - $ref: '#/components/schemas/AdditionalPurchaseReason'
            - type: 'null'
        notes:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
            - type: 'null'
      allOf:
        - if:
            properties:
              trigger_kind:
                const: rf_shortage
          then:
            properties:
              rf_id:
                $ref: '#/components/schemas/Uuid'
              rf_line_id:
                $ref: '#/components/schemas/Uuid'
          else:
            properties:
