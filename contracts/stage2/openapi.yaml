    rationale: >-
      Binary PDF generation and CSV export streaming are explicitly deferred per
      specification #27 MVP scope. Stage 2 delivers structured JSON reports and
      escaped non-executable printable HTML (/print) views enforcing identical
      chapter/duty scoping, explicit filters, units, PHP currency, stock category
      labels, server report time, Cache-Control: no-store, PrintCsp, and NoSniff.
