              - rf_id
              - rf_line_id
              - selection_sha256
              - reason
              - expires_at
            properties:
              rf_id:
                $ref: '#/components/schemas/Uuid'
              rf_line_id:
                $ref: '#/components/schemas/Uuid'
              selection_sha256:
                type: string
