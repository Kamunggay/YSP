    # --- Ticket 05: Unified PO/DA Receiving Reports, Discrepancies, Holds & Internal Posting ---
    ReceivingSourceKind:
      type: string
      enum:
        - po
        - da
      description: Stage 2 Receiving Report source kind (purchased PO or donated DA; Stage 1 IPC opening receipts remain exclusively on /opening-rms per RCV-01).
    ReceivingReportStatus:
      type: string
      enum:
        - draft
        - inspected
        - evidence_matched
        - posted
        - canceled
    ReceivingDiscrepancyStatus:
      type: string
      enum:
        - open
        - supplier_notified
        - under_review
        - resolved
    ReceivingDiscrepancyResolutionKind:
      type: string
      enum:
        - supplier_replacement_received
        - returned_to_supplier
        - credit_or_short_closed
        - donated_declined_or_disposed
    QuarantinedLotDisposition:
      type: string
      enum:
        - retained_in_quarantine
        - returned_to_supplier_physically
        - disposed_per_policy
      description: Physical disposition of quarantined/rejected lots; never silently converts quarantined units into usable stock (RCV-06, INV-14).
    ReceivingHoldStatus:
      type: string
      enum:
        - held
        - linked_to_source
        - rejected_returned
    ReceivingOperationName:
      type: string
      enum:
        - createReceivingReport
        - replaceReceivingReport
        - inspectReceivingReport
        - matchReceivingReportEvidence
        - postReceivingReport
        - cancelReceivingReport
        - notifySupplierOfReceivingDiscrepancy
        - resolveReceivingDiscrepancy
        - createReceivingHold
        - linkReceivingHoldSource
        - rejectReturnReceivingHold
      description: All unsafe Stage 2 receiving, discrepancy, and missing-source hold operations recoverable via /receiving-operations/*.
    ReceivingReportLineInput:
      type: object
      additionalProperties: false
      required:
        - source_line_id
        - variant_id
        - unit_id
        - delivered_quantity
        - accepted_quantity
        - damaged_quantity
        - rejected_quantity
        - unit_valuation_php
        - discrepancy_notes
        - resolves_discrepancy_id
      properties:
        source_line_id:
          $ref: '#/components/schemas/Uuid'
          description: Same-chapter PO line ID (source_kind po) or DA line ID (source_kind da).
        variant_id:
          $ref: '#/components/schemas/Uuid'
        unit_id:
          $ref: '#/components/schemas/Uuid'
        delivered_quantity:
          $ref: '#/components/schemas/PositiveStockQuantity'
          description: Exact-scale delivered quantity; must equal accepted_quantity + damaged_quantity + rejected_quantity.
        accepted_quantity:
          $ref: '#/components/schemas/StockQuantity'
        damaged_quantity:
          $ref: '#/components/schemas/StockQuantity'
        rejected_quantity:
          $ref: '#/components/schemas/StockQuantity'
        unit_valuation_php:
          $ref: '#/components/schemas/PhpAmount'
          description: Must match approved PO line unit_price_php (po) or acknowledged DA line unit_value_php (da) under valuation_rounding policy.
        discrepancy_notes:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
            - type: 'null'
          description: Mandatory when damaged_quantity > 0 or rejected_quantity > 0 (RCV-02, RCV-03).
        resolves_discrepancy_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Optional open/supplier_notified/under_review PO ReceivingDiscrepancy UUID being replaced by this new PO-RM (null for DA-RM).
    ReceivingReportLine:
      type: object
      additionalProperties: false
      required:
        - id
        - source_line_id
        - variant_id
        - unit_id
        - quantity_scale
        - delivered_quantity
        - accepted_quantity
        - damaged_quantity
        - rejected_quantity
        - unit_valuation_php
        - accepted_value_php
        - restrictions
        - discrepancy_notes
        - resolves_discrepancy_id
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_line_id:
          $ref: '#/components/schemas/Uuid'
        variant_id:
          $ref: '#/components/schemas/Uuid'
        unit_id:
          $ref: '#/components/schemas/Uuid'
        quantity_scale:
          type: integer
          minimum: 0
          maximum: 6
        delivered_quantity:
          $ref: '#/components/schemas/PositiveStockQuantity'
        accepted_quantity:
          $ref: '#/components/schemas/StockQuantity'
        damaged_quantity:
          $ref: '#/components/schemas/StockQuantity'
        rejected_quantity:
          $ref: '#/components/schemas/StockQuantity'
        unit_valuation_php:
          $ref: '#/components/schemas/PhpAmount'
        accepted_value_php:
          $ref: '#/components/schemas/PhpAmount'
        restrictions:
          $ref: '#/components/schemas/BoundedRestriction'
          description: Unrestricted for PO-RM; carries the DA line's current BoundedRestriction (unrestricted, bounded, or uninterpreted per ADR 0004) for DA-RM.
        discrepancy_notes:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
            - type: 'null'
        resolves_discrepancy_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    ReceivingInspection:
      type: object
      additionalProperties: false
      required:
        - inspector
        - technical_or_requesting_representative
        - inspected_at
        - inspection_notes
      properties:
        inspector:
          $ref: '#/components/schemas/ProcurementActor'
        technical_or_requesting_representative:
          oneOf:
            - $ref: '#/components/schemas/ProcurementActor'
            - type: 'null'
        inspected_at:
          $ref: '#/components/schemas/UtcInstant'
        inspection_notes:
