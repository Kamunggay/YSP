          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
            - type: 'null'
        canceled_by:
          oneOf:
            - $ref: '#/components/schemas/ProcurementActor'
            - type: 'null'
        canceled_at:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        cancel_reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
            - type: 'null'
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RepfLine'
        created_at:
          $ref: '#/components/schemas/UtcInstant'
        updated_at:
          $ref: '#/components/schemas/UtcInstant'
      allOf:
        - if:
            properties:
              status:
                enum:
                  - pending_budget_review
                  - approved
                  - held
                  - returned_for_revision
                  - rejected
                  - partially_ordered
                  - ordered
          then:
            properties:
              repf_reference:
                type: string
              submitted_by:
                $ref: '#/components/schemas/ProcurementActor'
              submitted_at:
                $ref: '#/components/schemas/UtcInstant'
        - if:
            properties:
              status:
                enum:
                  - approved
                  - partially_ordered
                  - ordered
          then:
            properties:
              approved_budget_php:
                $ref: '#/components/schemas/PhpAmount'
              budget_reviewer:
                $ref: '#/components/schemas/ProcurementActor'
              budget_reviewed_at:
                $ref: '#/components/schemas/UtcInstant'
              budget_decision:
                const: approve
        - if:
            properties:
              status:
                enum:
                  - held
                  - returned_for_revision
                  - rejected
          then:
            properties:
              budget_reviewer:
                $ref: '#/components/schemas/ProcurementActor'
              budget_reviewed_at:
                $ref: '#/components/schemas/UtcInstant'
              budget_decision:
                enum:
                  - hold
                  - return
                  - reject
              budget_decision_reason:
                type: string
        - if:
            properties:
              status:
                const: canceled
          then:
            properties:
              canceled_by:
                $ref: '#/components/schemas/ProcurementActor'
              canceled_at:
                $ref: '#/components/schemas/UtcInstant'
              cancel_reason:
                type: string
