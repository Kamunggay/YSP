          oneOf:
            - $ref: '#/components/schemas/ProcurementActor'
            - type: 'null'
        budget_reviewed_at:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        budget_decision:
          oneOf:
            - $ref: '#/components/schemas/RepfBudgetDecision'
            - type: 'null'
