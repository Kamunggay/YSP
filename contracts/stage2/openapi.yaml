    QuotationConflict:
      type: object
      additionalProperties: false
      required:
        - request_id
        - error
        - failed_intent_committed
        - current
        - setup_blockers
        - policy_evaluation
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - version_conflict
                - action_key_conflict
                - invalid_transition
                - source_not_eligible
                - quotation_policy_unmet
                - evidence_missing
                - evidence_invalid
                - evidence_mismatch
                - target_locked
                - setup_blocked
            message:
              type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
        failed_intent_committed:
          const: false
        current:
          oneOf:
            - $ref: '#/components/schemas/RepfQuotation'
            - $ref: '#/components/schemas/SupplierSelection'
            - type: 'null'
        setup_blockers:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/SetupBlocker'
        policy_evaluation:
          oneOf:
            - $ref: '#/components/schemas/QuotationPolicyEvaluation'
            - type: 'null'
      allOf:
        - if:
            properties:
              error:
                properties:
                  code:
                    const: setup_blocked
          then:
            properties:
              setup_blockers:
                minItems: 1
        - if:
            properties:
              error:
                properties:
                  code:
                    const: quotation_policy_unmet
          then:
            properties:
              policy_evaluation:
                $ref: '#/components/schemas/QuotationPolicyEvaluation'

