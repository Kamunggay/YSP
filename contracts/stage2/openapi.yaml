  responses:
    InvalidSelector:
      description: Unknown, repeated, or malformed query selector, malformed chapter UUID after admission, or foreign/malformed cursor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        const: invalid_selector
    Unauthenticated:
      description: Missing, expired, revoked, or disabled session; restart password sign-in.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        const: unauthenticated
    ChapterAccessDenied:
      description: mfa_incomplete for limited authentication or duty_denied for insufficient chapter duty. No protected state disclosed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - mfa_incomplete
                          - duty_denied
    ResourceNotFound:
      description: Uniform chapter_not_found for unknown/inactive/foreign chapter or missing membership; resource_not_found for unknown/foreign filter target within an admitted chapter.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - chapter_not_found
                          - resource_not_found
    ReplenishmentNeedsConflict:
      description: >-
        setup_blocked when required ROP, target_level, or quantity_scale policy is missing,
        unapproved, not_effective, or expired for the requested scope; snapshot_stale when
        a 5-minute pagination cursor expired or underlying authority/stock/demand changed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SetupBlocked'
              - allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        properties:
                          code:
                            const: snapshot_stale
    Throttled:
      description: Trusted-IP or per-account sliding-window rate limit exceeded.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        const: throttled
    Unavailable:
      description: Transient persistence or service failure; no diagnostic SQL or secrets exposed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        const: unavailable

    DonationMutationOk:
      description: Committed DA action receipt or its authorized replay.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DonationMutationResult'}
    DonationMutationCreated:
      description: Newly committed DA draft or resolution receipt, or its authorized replay.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Action-Replayed: {$ref: '#/components/headers/ActionReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DonationMutationResult'}
    DonationMalformedRequest:
      description: Malformed JSON, missing or malformed action key, duplicate key/header or invalid selector.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/Error'}
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - malformed_request
                      - invalid_selector
    DonationUnsupportedMedia:
      description: Send an application/json request body.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/Error'}
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - unsupported_media_type
    DonationCsrfMismatch:
      description: Missing, stale or mismatched CSRF proof.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/Error'}
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - csrf_mismatch
    DonationOperationNotFound:
      description: Unknown or inaccessible chapter or action receipt.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/Error'}
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - chapter_not_found
                      - operation_not_found
    DonationMutationDenied:
      description: Current session, action, paper-evidence scope, exact origin or independence requirement failed.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/Error'}
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - mfa_incomplete
                      - duty_denied
                      - origin_denied
                      - independence_required
    DonationRecoveryDenied:
      description: Current session, originating action, linked scope or configured independence requirement failed.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/Error'}
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - mfa_incomplete
                      - duty_denied
                      - independence_required
    DonationValidationFailed:
      description: Rejected closed request body with request-relative field pointers.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
    DonationMutationConflict:
      description: Uncommitted intent or missing effective setup. Current DA included only when authorized.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/DonationConflict'}
            - {$ref: '#/components/schemas/SetupBlocked'}
    DonationSnapshotStale:
      description: Expired pagination cursor or changed authorized snapshot.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/Error'}
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - snapshot_stale
    DonationPrint:
      description: Escaped, non-executable printable DA snapshot.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Content-Security-Policy:
          required: true
          schema: {const: default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action
              'none'}
        X-Content-Type-Options:
          required: true
          schema: {const: nosniff}
      content:
        text/html:
          schema:
            type: string
            minLength: 1

    UnsupportedMedia:
      description: Unsafe JSON operations require Content-Type application/json.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        const: unsupported_media_type
    CsrfMismatch:
      description: Missing, mismatched, or stale CSRF proof; refresh CSRF before retrying.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        const: csrf_mismatch
    InvalidInput:
      description: >-
        Well-formed JSON fails the operation request schema (including unsupported
        so_shortage trigger_kind, non-positive quantity, or missing mandatory reason).
        Field pointers are RFC 6901 relative to the request body. No key is consumed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    ProcurementAccessDenied:
      description: >-
        origin_denied for missing/foreign Origin, mfa_incomplete for limited session,
        duty_denied for insufficient chapter duty (including waiver approving_duties),
        independence_required when the budget/PO approver is the RepF preparer, PO
        preparer, or amendment proposer, or duty_limit_exceeded when the RepF or PO
        total exceeds the actor's active DutyGrant limit_php.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - origin_denied
                          - mfa_incomplete
                          - duty_denied
                          - independence_required
                          - duty_limit_exceeded
    OperationNotFound:
      description: >-
        Uniform chapter_not_found for unknown/foreign chapter or missing membership;
        uniform operation_not_found for unknown, in-flight, foreign-chapter, or
        other-actor procurement action receipts (not proof of rollback).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - chapter_not_found
                          - operation_not_found
    SnapshotStaleConflict:
      description: Five-minute snapshot cursor expired or underlying records/authority changed; restart from page 1.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        const: snapshot_stale
    RepfConflict:
      description: >-
        Closed Stage 2 RepF mutation conflict (version_conflict, action_key_conflict,
        invalid_transition, duplicate_supply_coverage, source_not_eligible,
        target_locked, or setup_blocked). Failed intent never commits.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RepfConflict'
    QuotationConflict:
      description: >-
        Closed Stage 2 quotation/supplier-selection conflict (version_conflict,
        action_key_conflict, invalid_transition, source_not_eligible,
        quotation_policy_unmet, evidence_missing, evidence_invalid, evidence_mismatch,
        target_locked, or setup_blocked). Failed intent never commits.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuotationConflict'
    PurchaseOrderConflict:
      description: >-
        Closed Stage 2 Purchase Order conflict (version_conflict, action_key_conflict,
        invalid_transition, source_not_eligible, quotation_policy_unmet,
        budget_limit_exceeded, po_has_accepted_receipts, evidence_missing,
        evidence_invalid, evidence_mismatch, target_locked, or setup_blocked).
        Failed intent never commits.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchaseOrderConflict'
    ReceivingAccessDenied:
      description: >-
        origin_denied for missing/foreign Origin, mfa_incomplete for limited session,
        or duty_denied for insufficient receiving/discrepancy/hold duty.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - origin_denied
                          - mfa_incomplete
                          - duty_denied
    ReceivingReportConflict:
      description: >-
        Uncommitted Receiving Report conflict: version_conflict, action_key_conflict,
        invalid_transition, source_not_eligible, substitution_or_overdelivery_blocked,
        evidence_missing, evidence_invalid, evidence_mismatch, acknowledgment_missing,
        target_locked, or setup_blocked. Includes failed_intent_committed: false,
        authorized current RM (or null), and setup_blockers.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReceivingReportConflict'
    ReceivingDiscrepancyConflict:
      description: >-
        Uncommitted Receiving Discrepancy conflict: version_conflict,
        action_key_conflict, invalid_transition, source_not_eligible (e.g.,
        notify-supplier on a DA discrepancy), discrepancy_already_resolved,
        evidence_missing, evidence_invalid, evidence_mismatch, target_locked, or
        setup_blocked.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReceivingDiscrepancyConflict'
    ReceivingHoldConflict:
      description: >-
        Uncommitted Missing-Source Delivery Hold conflict: version_conflict,
        action_key_conflict, invalid_transition, source_not_eligible,
        hold_already_resolved, evidence_missing, evidence_invalid, evidence_mismatch,
        target_locked, or setup_blocked.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReceivingHoldConflict'
    AllocationQueueConflict:
      description: >-
        setup_blocked when required allocation_priority or quantity_scale policy is
        missing, unapproved, not_effective, or expired; snapshot_stale when a
        5-minute pagination cursor expired or underlying authority/stock/demand
        changed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SetupBlocked'
              - allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        properties:
                          code:
                            const: snapshot_stale

