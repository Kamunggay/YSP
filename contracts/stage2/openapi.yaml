      summary: Advance a receiving discrepancy to under_review or record evidence-backed resolution
      description: >-
        Advances an open or supplier_notified discrepancy to under_review
        (action: start_review) or resolves a supplier_notified or under_review
        discrepancy to resolved (action: resolve), preserving the explicit state
        flow open -> supplier_notified | under_review -> resolved. Final resolution
        requires resolution_kind (supplier_replacement_received, returned_to_supplier,
        or credit_or_short_closed for source_kind po; donated_declined_or_disposed
        for source_kind da), mandatory reason, quarantined_lot_disposition, and exact
        signed receiving_discrepancy paper evidence verified via Leader's internal
        checkEvidenceBinding participant. supplier_replacement_received requires
        replacement_rm_id referencing a separate posted PO-RM against the same PO
        (never editing the immutable originating RM). Closing or short-closing a PO
        or DA never auto-resolves discrepancies or clears quarantined/rejected lots
        into usable stock (RCV-06, INV-14). Already resolved discrepancies reject
        with 409 discrepancy_already_resolved.
      security:
        - browserSession: []
