      required:
        - id
        - line_number
        - trigger_kind
        - item_id
        - item_code
        - variant_id
        - variant_code
        - display_name
        - unit_id
        - unit_code
        - quantity_scale
        - rf_id
        - rf_reference
        - rf_line_id
        - rf_material_version
        - linked_demand_canceled
