            schema: {$ref: '#/components/schemas/DonationVersionCheck'}
      responses:
        '200': {$ref: '#/components/responses/DonationMutationOk'}
        '400': {$ref: '#/components/responses/DonationMalformedRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/DonationMutationDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/DonationMutationConflict'}
        '415': {$ref: '#/components/responses/DonationUnsupportedMedia'}
        '419': {$ref: '#/components/responses/DonationCsrfMismatch'}
        '422': {$ref: '#/components/responses/DonationValidationFailed'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chapters/{chapter_id}/donations/{da_id}/acknowledge:
    post:
      operationId: acknowledgeDonation
      tags:
      - Donations
      x-owner: Leader
      x-existence: new
      x-required-action: da.acknowledge
      summary: Acknowledge the pending DA against signed paper and allocate its DA reference
      description: Require effective da_authorization. Verify exact da_acknowledgment paper through checkEvidenceBinding.
        Atomically allocate the DA reference from reference_series. This action creates no cash, Official Receipt
        or buyer credit.
      security:
      - browserSession: []
        csrfProof: []
      parameters:
      - {$ref: '#/components/parameters/ChapterId'}
      - {$ref: '#/components/parameters/DonationId'}
      - {$ref: '#/components/parameters/Origin'}
      - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcknowledgeDonation'}
      responses:
