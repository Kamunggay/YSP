          $ref: '#/components/schemas/CatalogueCode'
        variant_id:
          $ref: '#/components/schemas/Uuid'
        variant_code:
          $ref: '#/components/schemas/CatalogueCode'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        unit_id:
          $ref: '#/components/schemas/Uuid'
        unit_code:
          $ref: '#/components/schemas/CatalogueCode'
        quantity_scale:
          type: integer
