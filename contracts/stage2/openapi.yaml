        linked_demand_canceled_at:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        requested_quantity:
          $ref: '#/components/schemas/PositiveStockQuantity'
        ordered_quantity:
          $ref: '#/components/schemas/StockQuantity'
        canceled_quantity:
          $ref: '#/components/schemas/StockQuantity'
        remaining_to_order_quantity:
          $ref: '#/components/schemas/StockQuantity'
        estimated_unit_cost_php:
          $ref: '#/components/schemas/PhpAmount'
        estimated_line_total_php:
          $ref: '#/components/schemas/PhpAmount'
        needed_by:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
