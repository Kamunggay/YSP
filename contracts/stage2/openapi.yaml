        - trigger_kind
        - variant_id
        - unit_id
        - rf_id
        - rf_line_id
        - requested_quantity
        - estimated_unit_cost_php
        - needed_by
        - additional_purchase_reason
        - notes
      properties:
        trigger_kind:
          $ref: '#/components/schemas/RepfTriggerKind'
        variant_id:
          $ref: '#/components/schemas/Uuid'
        unit_id:
          $ref: '#/components/schemas/Uuid'
        rf_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
