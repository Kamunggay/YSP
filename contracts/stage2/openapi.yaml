    DonationVersionCheck:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - expected_material_version
      properties:
        expected_version: {$ref: '#/components/schemas/DonationVersion'}
        expected_material_version: {$ref: '#/components/schemas/DonationVersion'}
    DonationReasonedAction:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - expected_material_version
      - reason
      properties:
        expected_version: {$ref: '#/components/schemas/DonationVersion'}
        expected_material_version: {$ref: '#/components/schemas/DonationVersion'}
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
    AcknowledgeDonation:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - expected_material_version
      - evidence
      - signed_at
      - confirm_paper_matches
      properties:
        expected_version: {$ref: '#/components/schemas/DonationVersion'}
        expected_material_version: {$ref: '#/components/schemas/DonationVersion'}
        evidence: {$ref: '#/components/schemas/EvidenceByteBinding'}
        signed_at: {$ref: '#/components/schemas/UtcInstant'}
        confirm_paper_matches: {const: true}
    ResolveDonationRestriction:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - expected_material_version
      - evidence
      - signed_at
      - confirm_paper_matches
      - da_line_id
      - reason
      - resolution_kind
      - restrictions
      properties:
        expected_version: {$ref: '#/components/schemas/DonationVersion'}
        expected_material_version: {$ref: '#/components/schemas/DonationVersion'}
        evidence: {$ref: '#/components/schemas/EvidenceByteBinding'}
        signed_at: {$ref: '#/components/schemas/UtcInstant'}
        confirm_paper_matches: {const: true}
        da_line_id: {$ref: '#/components/schemas/Uuid'}
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
        resolution_kind:
