            - repf
            - quotation
            - purchase_order
            - donation
            - receiving_report
            - receiving_discrepancy
            - receiving_hold
        record_id:
          $ref: '#/components/schemas/Uuid'
        record_reference:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 80
              pattern: '\S'
            - type: 'null'
        action:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_]*$'
        actor:
          $ref: '#/components/schemas/ProcurementActor'
        occurred_at:
          $ref: '#/components/schemas/UtcInstant'
        reason:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
            - type: 'null'
    ControlReportTotals:
      type: object
      additionalProperties: false
      required:
        - donation_row_count
        - uninterpreted_donation_count
        - resolution_count
        - overdue_exception_count
        - audit_entry_count
        - total_declared_donation_value_php
      properties:
        donation_row_count:
          type: integer
          minimum: 0
          maximum: 2147483647
        uninterpreted_donation_count:
          type: integer
          minimum: 0
          maximum: 2147483647
        resolution_count:
          type: integer
          minimum: 0
          maximum: 2147483647
        overdue_exception_count:
          type: integer
          minimum: 0
          maximum: 2147483647
        audit_entry_count:
          type: integer
          minimum: 0
          maximum: 2147483647
        total_declared_donation_value_php:
          $ref: '#/components/schemas/PhpAmount'
    ControlReportResponse:
      type: object
      additionalProperties: false
      required:
        - metadata
        - donation_restrictions
        - restriction_resolutions
        - overdue_exceptions
        - audit_history
        - totals
        - page
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/ReportMetadata'
            - properties:
                report_kind:
                  const: control
                filters:
                  properties:
                    status:
                      $ref: '#/components/schemas/ControlReportStatus'
        donation_restrictions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ControlDonationRestrictionRow'
        restriction_resolutions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ControlRestrictionResolutionRow'
        overdue_exceptions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ControlOverdueExceptionRow'
        audit_history:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ControlAuditHistoryRow'
        totals:
          $ref: '#/components/schemas/ControlReportTotals'
        page:
          $ref: '#/components/schemas/Page'

