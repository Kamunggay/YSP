          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
        valuation_kind:
          enum:
          - declared
          - estimated
        unit_value_php: {$ref: '#/components/schemas/PhpAmount'}
        valuation_basis:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
        restrictions: {$ref: '#/components/schemas/DonationRestriction'}
    DonationDraft:
      type: object
      additionalProperties: false
      required:
      - donor_name
      - lines
      properties:
        donor_name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        lines:
