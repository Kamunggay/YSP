          $ref: '#/components/schemas/Uuid'
        location_id:
          $ref: '#/components/schemas/Uuid'
        condition:
          type: string
          enum:
            - usable
            - quarantined
            - rejected
        custody:
          const: stockroom
        source_kind:
          type: string
          enum:
            - po_rm
            - da_rm
        quantity:
          $ref: '#/components/schemas/PositiveStockQuantity'
        restrictions:
          $ref: '#/components/schemas/BoundedRestriction'
        immediately_allocatable:
          type: boolean
          description: True for usable stockroom lots whose restrictions.state is unrestricted or bounded (RCV-04, INV-09); false for quarantined/rejected lots (INV-14) and ADR 0004 uninterpreted DA lots.
      allOf:
        - if:
            properties:
              condition:
                enum:
                  - quarantined
                  - rejected
          then:
            properties:
              immediately_allocatable:
                const: false
        - if:
            properties:
              restrictions:
                properties:
                  state:
                    const: uninterpreted
          then:
            properties:
              immediately_allocatable:
                const: false
        - if:
            properties:
              source_kind:
                const: po_rm
          then:
            properties:
              restrictions:
                properties:
                  state:
                    const: unrestricted
                  allowed_uses:
                    const: []
                  event_ids:
                    const: []
                  requesting_unit_ids:
                    const: []
                  effective_from:
                    type: 'null'
                  effective_until:
                    type: 'null'
                  interpretation_id:
                    type: 'null'
                  source_condition_reference:
                    type: 'null'
