x-stage1-compatibility:
  cancelInternalRf:
    stage1_operation: POST /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/cancel
    owner: Glenn
    procurement_consumer: Leader
    requirement: PRC-08
    contract: >-
      Stage 1 cancelInternalRf HTTP path, request schema, and response schema remain
      unchanged and never deadlock on open Stage 2 RepFs or POs. When cancelInternalRf
      cancels an unissued RF remainder in the same MySQL transaction, every linked open
      RepF line (status in draft, pending_budget_review, held, returned_for_revision,
      approved, partially_ordered) and linked open PO (ticket 03) is flagged with
      linked_demand_canceled: true and linked_demand_canceled_at: committed_at, appends a
      linked_demand_canceled RepF history entry (incrementing version without bumping
      material_version), emits stage2.repf.changed.v1 on commit, and surfaces a live
      derived demand_changed officer alert in GET /alerts (ticket 06).
