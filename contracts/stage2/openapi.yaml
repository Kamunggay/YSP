      description: Historical DA and evidence disclosure requires current history.read and applicable evidence.read.
      security:
      - browserSession: []
      parameters:
      - {$ref: '#/components/parameters/ChapterId'}
      - {$ref: '#/components/parameters/DonationId'}
      - {$ref: '#/components/parameters/DonationVersionPath'}
      responses:
        '200':
          description: Authorized DA read.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationResult'}
        '400': {$ref: '#/components/responses/InvalidSelector'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ChapterAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chapters/{chapter_id}/donations/{da_id}/related:
    get:
      operationId: listDonationRelated
      tags:
      - Donations
      x-owner: Leader
      x-existence: new
      x-required-action: da.read
      summary: List authorized related DA-RMs, receiving discrepancies and stock lots
      description: Stable order by resource_kind, resource_id and da_line_id after filtering by linked scope.
      security:
      - browserSession: []
      parameters:
      - {$ref: '#/components/parameters/ChapterId'}
      - {$ref: '#/components/parameters/DonationId'}
      - {$ref: '#/components/parameters/PageLimit'}
      - {$ref: '#/components/parameters/SnapshotCursor'}
      responses:
        '200':
          description: Authorized DA read.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationRelatedList'}
        '400': {$ref: '#/components/responses/InvalidSelector'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ChapterAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/DonationSnapshotStale'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chapters/{chapter_id}/donations/{da_id}/print:
    get:
      operationId: printDonation
      tags:
      - Donations
      x-owner: Leader
      x-existence: new
      x-required-action: da.read
      summary: Print the current DA as HTML
      description: Identify the exact DA status, version, material version and valuation. Omit private evidence URLs,
        bytes and signatures.
      security:
      - browserSession: []
      parameters:
      - {$ref: '#/components/parameters/ChapterId'}
      - {$ref: '#/components/parameters/DonationId'}
      responses:
        '200': {$ref: '#/components/responses/DonationPrint'}
        '400': {$ref: '#/components/responses/InvalidSelector'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ChapterAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
