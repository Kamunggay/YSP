              - DISPATCH
              - PURCHASING
              - BUDGET_APPROVER
              - RECEIVING
              - RF_APPROVER
              - FINANCE
              - CHAPTER_HEAD
              - INDEPENDENT_REVIEWER
        persisted_ack_supported:
          const: false
        observed_at:
          $ref: '#/components/schemas/UtcInstant'
        page:
          $ref: '#/components/schemas/Page'

