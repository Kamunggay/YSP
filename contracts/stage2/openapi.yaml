            - type: 'null'
        notes:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
            - type: 'null'
      allOf:
        - if:
            properties:
              trigger_kind:
                const: rf_shortage
          then:
            properties:
              rf_id:
                $ref: '#/components/schemas/Uuid'
              rf_reference:
                type: string
              rf_line_id:
                $ref: '#/components/schemas/Uuid'
              rf_material_version:
                type: integer
          else:
            properties:
