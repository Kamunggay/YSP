        (unreserved_outstanding_quantity > 0) ordered strictly by INV-09:
        (1) active commitments (active_reserved_quantity > 0), (2) approved
        allocation_priority overrides, then (3) approved priority_rank ascending,
        needed_at ascending, approved_at ascending, and deterministic rf_line_id
        ascending tie-breaker. Displays each line's current eligible available stock
        from newly posted PO-RM, DA-RM, and Opening RM usable stockroom lots while
        excluding active StockHolds and ineligible or ADR 0004 uninterpreted
        BoundedRestriction lots (RCV-04). Read-only guidance only
        (is_commit_authorization: false); officers execute reservations and repeated
        signed partial issues through Stage 1 unchanged /internal-rfs*,
        /reservation-preparations*, /reservations*, and /actual-issues* routes
        (INV-09, RF-05 through RF-08, RCV-04). Safe GET accepts no request body and
        no X-Action-Key. Reject unknown or repeated query selectors with 400
        invalid_selector. Missing/expired allocation_priority or quantity_scale
        policy returns 409 setup_blocked; expired or mutated 5-minute cursors return
        409 snapshot_stale. Every response sends Cache-Control: no-store.
