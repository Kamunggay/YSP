          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        rf_material_version:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 2147483647
            - type: 'null'
        linked_demand_canceled:
          type: boolean
          description: Set true when Stage 1 cancelInternalRf cancels the linked RF's unissued remainder (PRC-08).
