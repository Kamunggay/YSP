                const: rf_shortage
          then:
            properties:
              rf_id:
                $ref: '#/components/schemas/Uuid'
              rf_reference:
                type: string
              rf_line_id:
                $ref: '#/components/schemas/Uuid'
              rf_material_version:
                type: integer
          else:
            properties:
              rf_id:
                type: 'null'
              rf_reference:
                type: 'null'
              rf_line_id:
                type: 'null'
              rf_material_version:
                type: 'null'
              linked_demand_canceled:
                const: false
              linked_demand_canceled_at:
                type: 'null'
