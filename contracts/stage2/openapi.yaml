components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: ysp_session
      description: >-
        Opaque server-side session cookie inherited verbatim from Stage 1. Cookie
        possession is not proof of completed MFA or current chapter access.
    csrfProof:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie tied to this browser session; required with exact Origin on unsafe methods.

  headers:
    NoStore:
      required: true
      schema:
        const: no-store
      example: no-store
      description: Applies to every /api/v1 Stage 2 response including errors, 204s, and printable HTML.
    ActionReplayed:
      required: true
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
      example: 'false'
      description: >-
        false on first commitment, true on authorized same-key/same-payload snapshot
        replay. Snapshots do not refresh authority or expiry.
    RetryAfter:
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
      example: '60'
      description: Positive integer delta seconds until next allowed attempt.

    PrintCsp:
      required: true
      schema:
        const: "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      example: "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      description: Non-executable Content-Security-Policy inherited verbatim from Stage 1 printable HTML routes.
    NoSniff:
      required: true
      schema:
        const: nosniff
      example: nosniff
      description: Prevents MIME sniffing on printable HTML views.

  parameters:
    ChapterId:
      in: path
      name: chapter_id
      required: true
      description: Opaque resource chapter UUID. Current membership admission precedes identifier validation and existence disclosure.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 60000000-0000-4000-8000-000000000001
    Origin:
      in: header
      name: Origin
      required: true
      description: Must equal configured browser origin on all unsafe Stage 2 requests; missing/null/foreign is denied with 403 origin_denied.
      schema:
        type: string
        format: uri
      example: https://ysp.example.invalid
    ActionKey:
      in: header
      name: X-Action-Key
      required: true
      description: >-
        Client-generated UUID per intent, scoped to chapter + immutable actor + operationId
        with canonical validated payload fingerprinting. Reused across Stage 2 unsafe methods.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 40000000-0000-4000-8000-000000000001
    PageLimit:
      in: query
      name: limit
      required: false
      description: Integer page size (1 to 100, default 25). Reject repeated or non-integer values with 400 invalid_selector.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    SnapshotCursor:
      in: query
      name: cursor
      required: false
      description: >-
        Omit on first page. Five-minute opaque snapshot-bound cursor encoding actor,
        chapter, authority version, normalized filters, sort, limit, and snapshot version.
        Expired or mutated snapshot yields 409 snapshot_stale; foreign or malformed cursor
        yields 400 invalid_selector.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: '\S'
    ReplenishmentItemFilter:
      in: query
      name: item_id
      required: false
      description: Optional chapter-owned item UUID filter; unknown or foreign item yields uniform 404 resource_not_found.
      schema:
        $ref: '#/components/schemas/Uuid'
    ReplenishmentVariantFilter:
      in: query
      name: variant_id
      required: false
      description: Optional chapter-owned variant UUID filter; unknown or foreign variant yields uniform 404 resource_not_found.
      schema:
        $ref: '#/components/schemas/Uuid'
    ReplenishmentTriggerFilter:
      in: query
      name: trigger_filter
      required: false
      description: >-
        Optional trigger scope filter. Default all returns every active variant with
        computed figures. rop_breach returns low-stock items (usable_stockroom_on_hand <=
        approved_rop) and returns 409 setup_blocked if required ROP/target policies are
        missing or expired for the filtered scope. rf_shortage returns variants with
        positive unreserved_approved_rf_shortage. uncovered_only returns variants with
        positive proposed_uncovered_quantity.
      schema:
        type: string
        enum:
          - all
          - rf_shortage
          - rop_breach
          - uncovered_only
        default: all
    CatalogueSearch:
      in: query
      name: q
      required: false
      description: Trim outer ASCII spaces; ASCII case-insensitive literal prefix match on item/variant code or display name; no wildcards.
      schema:
        type: string
        minLength: 1
        maxLength: 80

    DonationId:
      name: da_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    DonationVersionPath:
      name: version
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DonationVersion'}
    DonationStatusFilter:
      name: status
      in: query
      required: false
      schema: {$ref: '#/components/schemas/DonationStatus'}
    DonationOperationId:
      name: operation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    DonationOperationName:
      name: operation_name
      in: query
      required: true
      schema: {$ref: '#/components/schemas/DonationMutationName'}
    DonationActionKeyLookup:
      name: action_key
      in: query
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
      description: Sensitive original-actor selector. Exclude it from logs.

    RepfId:
      in: path
      name: repf_id
      required: true
      description: Opaque chapter-scoped RepF UUID. Unknown or foreign RepF returns uniform 404 resource_not_found after chapter admission.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 90000000-0000-4000-8000-000000000010
    RepfVersion:
      in: path
      name: version
      required: true
      description: Exact historical RepF version integer (>= 1). Unknown version yields uniform 404 resource_not_found.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1
    RepfStatusFilter:
      in: query
      name: status
      required: false
      description: Optional RepF lifecycle status filter. Omit to return all statuses.
      schema:
        $ref: '#/components/schemas/RepfStatus'
    RepfTriggerFilter:
      in: query
      name: trigger_kind
      required: false
      description: Optional Stage 2 RepF trigger filter (rf_shortage or rop_replenishment only; so_shortage returns 400 invalid_selector).
      schema:
        $ref: '#/components/schemas/RepfTriggerKind'
    RepfRfFilter:
      in: query
      name: rf_id
      required: false
      description: Optional chapter-owned internal RF UUID filter matching RepFs linked to that RF.
      schema:
        $ref: '#/components/schemas/Uuid'
    RepfLinkedDemandCanceledFilter:
      in: query
      name: linked_demand_canceled
      required: false
      description: Optional boolean filter matching RepFs flagged by Stage 1 cancelInternalRf (PRC-08).
      schema:
        type: boolean
    ProcurementOperationNameParam:
      in: query
      name: operation_name
      required: true
      description: Exact Stage 2 procurement mutation operationId whose committed receipt is being recovered.
      schema:
        $ref: '#/components/schemas/ProcurementOperationName'
      example: submitRepf
    ProcurementActionKeyLookup:
      in: query
      name: action_key
      required: true
      description: Original actor's X-Action-Key UUID for recovery lookup; sensitive selector, never log query strings.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 40000000-0000-4000-8000-000000000210
    ProcurementOperationId:
      in: path
      name: operation_id
      required: true
      description: Server-assigned immutable procurement operation receipt UUID.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 49000000-0000-4000-8000-000000000001
    QuotationId:
      in: path
      name: quotation_id
      required: true
      description: Opaque chapter-scoped nested RepF quotation UUID. Unknown or foreign quotation returns uniform 404 resource_not_found.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 93000000-0000-4000-8000-000000000001
    ExpectedVersionQuery:
      in: query
      name: expected_version
      required: true
      description: Optimistic concurrency resource version integer required for bodyless DELETE mutations.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1
    ExpectedMaterialVersionQuery:
      in: query
      name: expected_material_version
      required: true
      description: Optimistic concurrency material version integer required for bodyless DELETE mutations.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1
    PurchaseOrderId:
      in: path
      name: po_id
      required: true
      description: Opaque chapter-scoped Purchase Order UUID. Unknown or foreign PO returns uniform 404 resource_not_found.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 94000000-0000-4000-8000-000000000001
    PurchaseOrderAmendmentId:
      in: path
      name: amendment_id
      required: true
      description: Opaque chapter-scoped Purchase Order amendment UUID. Unknown or foreign amendment returns uniform 404 resource_not_found.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 94500000-0000-4000-8000-000000000001
    PurchaseOrderVersion:
      in: path
      name: version
      required: true
      description: Exact historical Purchase Order version integer (>= 1). Unknown version yields uniform 404 resource_not_found.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1
    PoStatusFilter:
      in: query
      name: status
      required: false
      description: Optional Purchase Order lifecycle status filter. Omit to return all statuses.
      schema:
        $ref: '#/components/schemas/PurchaseOrderStatus'
    PoRepfFilter:
      in: query
      name: repf_id
      required: false
      description: Optional originating RepF UUID filter for Purchase Orders.
      schema:
        $ref: '#/components/schemas/Uuid'
    PoLinkedDemandCanceledFilter:
      in: query
      name: linked_demand_canceled
      required: false
      description: Optional boolean filter matching Purchase Orders flagged by Stage 1 cancelInternalRf (PRC-08).
      schema:
        type: boolean
    ReceivingReportId:
      in: path
      name: rm_id
      required: true
      description: Chapter-scoped Stage 2 Receiving Report UUID.
      schema:
        $ref: '#/components/schemas/Uuid'
    ReceivingReportVersion:
      in: path
      name: version
      required: true
      description: Immutable Receiving Report version number to read.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    ReceivingSourceKindFilter:
      in: query
      name: source_kind
      required: false
      description: Optional Stage 2 receiving source kind filter (po or da).
      schema:
        $ref: '#/components/schemas/ReceivingSourceKind'
    ReceivingStatusFilter:
      in: query
      name: status
      required: false
      description: Optional Receiving Report status filter.
      schema:
        $ref: '#/components/schemas/ReceivingReportStatus'
    ReceivingSourceIdFilter:
      in: query
