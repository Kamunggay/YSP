x-stage1-compatibility:
  openingRmsUnchanged:
    stage1_operations:
      - GET /api/v1/chapters/{chapter_id}/opening-rms
      - POST /api/v1/chapters/{chapter_id}/opening-rms
      - GET /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}
      - PUT /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}
      - POST /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/inspection
      - POST /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/evidence-match
      - POST /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/post
      - GET /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/movements
      - GET /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/findings
      - GET /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/history
      - GET /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/versions/{revision}
      - GET /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/related
      - GET /api/v1/chapters/{chapter_id}/opening-rms/{rm_id}/print
    owner: Leader
    posting_participant_owner: Efren
    requirements:
      - RCV-01
      - RCV-10
    contract: >-
      Stage 1 /opening-rms* routes, request/response schemas, IPC opening baseline
      lock, and prepareOpeningInventory remain completely unchanged. Stage 2
      /receiving-reports accepts strictly source_kind po or da and shares only the
      chapter's yearly RM reference_series counter on postReceivingReport.
      Missing-source deliveries live in /receiving-holds and never create or link
      an IPC.
  cancelInternalRf:
    stage1_operation: POST /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/cancel
    owner: Glenn
    procurement_consumer: Leader
    requirement: PRC-08
    contract: >-
      Stage 1 cancelInternalRf HTTP path, request schema, and response schema remain
      unchanged and never deadlock on open Stage 2 RepFs or POs. When cancelInternalRf
      cancels an unissued RF remainder in the same MySQL transaction, every linked open
      RepF line (status in draft, pending_budget_review, held, returned_for_revision,
      approved, partially_ordered) and every linked open PO line (status in draft,
      pending_approval, returned_for_revision, issued, partially_received) is flagged
      with linked_demand_canceled: true and linked_demand_canceled_at: committed_at,
      appends a linked_demand_canceled history entry on affected RepFs and POs
      (incrementing version without bumping material_version), emits
      stage2.repf.changed.v1 and stage2.purchase-order.changed.v1 on commit, and
      surfaces a live derived demand_changed officer alert in GET /alerts (ticket 06).
  stage1StockInboundOpenPo:
    stage1_operations:
      - GET /api/v1/chapters/{chapter_id}/stock
      - GET /api/v1/chapters/{chapter_id}/stock/variants/{variant_id}
    owner: Glenn
    procurement_producer: Leader
    requirements:
      - PRC-07
      - PRC-09
    contract: >-
      Stage 1 StockSummary.views.inbound_open_po.quantity (exact variant scale 0..6,
      non-additive alongside usable_stockroom_on_hand) projects the live chapter sum of
      outstanding_quantity across PurchaseOrder lines whose parent PO status is issued
      or partially_received. Issuing a PO via approvePurchaseOrder or amending ordered
      quantities via approvePurchaseOrderAmendment updates inbound_open_po immediately
      without changing usable_stockroom_on_hand, available_to_allocate, or resolving
      linked RF shortages. Posting PO-RM accepted receipts decreases outstanding_quantity
      and inbound_open_po; rejected/damaged units remain tracked in
      rejected_or_disputed_quantity without reducing outstanding_quantity until
      accepted replacement or closeShortPurchaseOrder/cancelPurchaseOrder zeroes
      outstanding_quantity.
  repeatedRfFulfillmentUnchanged:
    stage1_operations:
      - GET /api/v1/chapters/{chapter_id}/internal-rfs
      - GET /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}
      - GET /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/allocation-review
      - POST /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/reservation-preparations
      - POST /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/reservation-preparations/{preparation_id}/commit
      - GET /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/reservations
      - POST /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/reservations/{reservation_id}/release
      - POST /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/reservations/{reservation_id}/reallocate
      - POST /api/v1/chapters/{chapter_id}/internal-rfs/{rf_id}/actual-issues
      - POST /api/v1/chapters/{chapter_id}/actual-issues/{issue_id}/acknowledgments
      - POST /api/v1/chapters/{chapter_id}/actual-issues/{issue_id}/post
    allocation_queue_owner: Glenn
    actual_issue_owner: Efren
    receiving_orchestrator: Leader
    requirements:
      - INV-09
      - RF-05
      - RF-06
      - RF-07
      - RF-08
      - RCV-04
    contract: >-
      Stage 1 /internal-rfs*, /reservation-preparations*, /reservations*, and
      /actual-issues* routes and schemas remain completely unchanged in Stage 2.
      Once Leader postReceivingReport commits accepted PO-RM or DA-RM stockroom
      lots through Efren prepareReceivingInventory (RCV-04), eligible usable lots
      appear immediately in Glenn GET /allocation-queue alongside existing active
      commitments and approved pending RF lines ordered by INV-09. Officers reserve
      newly posted lots through Stage 1 prepareRfReservation + commitRfReservation
      and execute each repeated partial physical batch through Stage 1
      prepareActualIssue + matchActualIssueAcknowledgment + postActualIssue until
      the RF reaches RF-08 closure (all approved demand issued or remainder formally
      canceled).

