    # --- Derived Officer Alert Schemas (Leader; RPT-01) ---
    OfficerAlertType:
      type: string
      enum:
        - low_stock_rop
        - repf_pending_approval
        - po_pending_approval
        - da_pending_acknowledgment
        - demand_changed
        - open_receiving_discrepancy
        - active_missing_source_hold
        - open_rf_shortage
    OfficerAlertSeverity:
      type: string
      enum:
        - critical
        - warning
        - info
    OfficerAlertRecordKind:
      type: string
      enum:
        - variant
        - repf
        - purchase_order
        - donation
        - receiving_discrepancy
        - receiving_hold
        - internal_rf
    OfficerAlert:
      type: object
      additionalProperties: false
      required:
        - alert_key
        - alert_type
        - severity
        - record_kind
        - record_id
        - record_reference
        - responsible_duty
        - summary
        - target_route_hint
        - detected_at
      properties:
        alert_key:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[0-9a-f-]{36}$'
        alert_type:
          $ref: '#/components/schemas/OfficerAlertType'
        severity:
          $ref: '#/components/schemas/OfficerAlertSeverity'
        record_kind:
          $ref: '#/components/schemas/OfficerAlertRecordKind'
        record_id:
          $ref: '#/components/schemas/Uuid'
        record_reference:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 80
              pattern: '\S'
            - type: 'null'
          description: Allocated human document reference or variant code; null for unnumbered drafts or missing-source holds.
        responsible_duty:
          $ref: '#/components/schemas/Duty'
        summary:
          type: string
          minLength: 1
          maxLength: 300
          pattern: '\S'
        target_route_hint:
          type: string
          minLength: 1
          maxLength: 240
          pattern: '^/api/v1/chapters/[0-9a-f-]{36}/'
        detected_at:
          $ref: '#/components/schemas/UtcInstant'
      allOf:
        - if:
            properties:
              alert_type:
                const: low_stock_rop
          then:
            properties:
              record_kind:
                const: variant
              responsible_duty:
                enum:
                  - INVENTORY
                  - PURCHASING
        - if:
            properties:
              alert_type:
                const: repf_pending_approval
          then:
            properties:
              record_kind:
                const: repf
              responsible_duty:
                enum:
                  - BUDGET_APPROVER
                  - CHAPTER_HEAD
        - if:
            properties:
              alert_type:
                const: po_pending_approval
          then:
            properties:
              record_kind:
                const: purchase_order
              responsible_duty:
                enum:
                  - BUDGET_APPROVER
                  - CHAPTER_HEAD
        - if:
            properties:
              alert_type:
                const: da_pending_acknowledgment
          then:
            properties:
              record_kind:
                const: donation
              responsible_duty:
                enum:
                  - INVENTORY
                  - RECEIVING
                  - CHAPTER_HEAD
                  - FINANCE
        - if:
            properties:
              alert_type:
                const: demand_changed
          then:
            properties:
              record_kind:
                enum:
                  - repf
                  - purchase_order
              responsible_duty:
                enum:
                  - PURCHASING
                  - BUDGET_APPROVER
                  - CHAPTER_HEAD
        - if:
            properties:
              alert_type:
                const: open_receiving_discrepancy
          then:
            properties:
              record_kind:
                const: receiving_discrepancy
              responsible_duty:
                enum:
                  - RECEIVING
                  - PURCHASING
                  - INVENTORY
                  - CHAPTER_HEAD
        - if:
            properties:
              alert_type:
                const: active_missing_source_hold
          then:
            properties:
              record_kind:
                const: receiving_hold
              responsible_duty:
                enum:
                  - RECEIVING
                  - INVENTORY
                  - CHAPTER_HEAD
        - if:
            properties:
              alert_type:
                const: open_rf_shortage
          then:
            properties:
              record_kind:
                const: internal_rf
              responsible_duty:
                enum:
                  - INVENTORY
                  - PURCHASING
                  - DISPATCH
    OfficerAlertList:
      type: object
      additionalProperties: false
      required:
        - data
        - caller_matched_duties
        - persisted_ack_supported
        - observed_at
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OfficerAlert'
        caller_matched_duties:
          type: array
