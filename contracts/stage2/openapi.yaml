        '200':
          description: Authorized DA read.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationResult'}
        '400': {$ref: '#/components/responses/InvalidSelector'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ChapterAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: replaceDonation
      tags:
      - Donations
      x-owner: Leader
      x-existence: new
      x-required-action: da.draft
      summary: Replace the full draft and its lines
      security:
      - browserSession: []
