            - overdue_missing_source_hold
            - unresolved_uninterpreted_restriction
        record_id:
          $ref: '#/components/schemas/Uuid'
        record_reference:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 80
              pattern: '\S'
            - type: 'null'
        location_id:
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        responsible_duty:
          $ref: '#/components/schemas/Duty'
        status:
          type: string
          minLength: 1
          maxLength: 60
          pattern: '^[a-z][a-z0-9_]*$'
        due_or_since_at:
          $ref: '#/components/schemas/UtcInstant'
        overdue_hours:
          type: integer
          minimum: 1
          maximum: 2147483647
        summary:
          type: string
          minLength: 1
          maxLength: 300
          pattern: '\S'
    ControlAuditHistoryRow:
      type: object
      additionalProperties: false
      required:
        - event_id
        - record_kind
        - record_id
        - record_reference
        - action
        - actor
        - occurred_at
        - reason
      properties:
        event_id:
          $ref: '#/components/schemas/Uuid'
        record_kind:
          type: string
