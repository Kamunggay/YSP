          $ref: '#/components/schemas/BoundedRestriction'
        allocatable_now:
          type: boolean
      allOf:
        - if:
            properties:
              restriction:
                properties:
                  state:
                    const: uninterpreted
          then:
            properties:
              allocatable_now:
                const: false
    ControlRestrictionResolutionRow:
      type: object
      additionalProperties: false
      required:
        - resolution_id
        - da_id
        - da_reference
        - da_line_id
        - previous_state
        - resolved_state
        - affected_lot_count
        - evidence_id
        - actor
        - resolved_at
        - reason
      properties:
        resolution_id:
          $ref: '#/components/schemas/Uuid'
        da_id:
          $ref: '#/components/schemas/Uuid'
        da_reference:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '\S'
        da_line_id:
          $ref: '#/components/schemas/Uuid'
        previous_state:
          type: string
          enum:
            - uninterpreted
            - bounded
            - unrestricted
        resolved_state:
          type: string
          enum:
            - unrestricted
            - bounded
            - uninterpreted
          description: Includes uninterpreted for ADR 0004 audit_review records when a donor condition remains inexpressible.
        affected_lot_count:
          type: integer
          minimum: 0
          maximum: 10000
        evidence_id:
          $ref: '#/components/schemas/Uuid'
        actor:
          $ref: '#/components/schemas/ProcurementActor'
        resolved_at:
          $ref: '#/components/schemas/UtcInstant'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
    ControlOverdueExceptionRow:
      type: object
      additionalProperties: false
      required:
        - exception_kind
        - record_id
        - record_reference
        - location_id
        - responsible_duty
        - status
        - due_or_since_at
        - overdue_hours
        - summary
