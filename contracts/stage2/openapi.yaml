          $ref: '#/components/schemas/StockQuantity'
        rejected_quantity:
          $ref: '#/components/schemas/StockQuantity'
        total_discrepant_quantity:
          $ref: '#/components/schemas/PositiveStockQuantity'
        quarantined_lot_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        rejected_lot_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        quarantined_lots_auto_cleared_on_source_close:
          const: false
          description: Normative RCV-06 invariant confirming closing or short-closing a PO or DA never clears quarantined/rejected lots.
        discrepancy_notes:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
        supplier_notification:
          oneOf:
            - $ref: '#/components/schemas/DiscrepancySupplierNotification'
            - type: 'null'
        review_started_by:
          oneOf:
            - $ref: '#/components/schemas/ProcurementActor'
            - type: 'null'
        review_started_at:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        review_notes:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
              pattern: '\S'
            - type: 'null'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/ReceivingDiscrepancyResolution'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/UtcInstant'
        updated_at:
          $ref: '#/components/schemas/UtcInstant'
      allOf:
        - anyOf:
            - properties:
                quarantined_lot_id:
                  $ref: '#/components/schemas/Uuid'
            - properties:
                rejected_lot_id:
                  $ref: '#/components/schemas/Uuid'
        - if:
            properties:
              source_kind:
                const: da
          then:
            properties:
              supplier_notification:
                type: 'null'
        - if:
            properties:
              status:
                const: open
          then:
            properties:
              supplier_notification:
                type: 'null'
              review_started_by:
                type: 'null'
              review_started_at:
                type: 'null'
              review_notes:
                type: 'null'
              resolution:
                type: 'null'
        - if:
            properties:
              status:
                const: supplier_notified
          then:
            properties:
              source_kind:
                const: po
              supplier_notification:
                $ref: '#/components/schemas/DiscrepancySupplierNotification'
              review_started_by:
                type: 'null'
              review_started_at:
                type: 'null'
              review_notes:
                type: 'null'
              resolution:
                type: 'null'
        - if:
            properties:
              status:
                const: under_review
          then:
            properties:
              review_started_by:
                $ref: '#/components/schemas/ProcurementActor'
              review_started_at:
                $ref: '#/components/schemas/UtcInstant'
              review_notes:
                type: string
                minLength: 1
                maxLength: 500
                pattern: '\S'
              resolution:
                type: 'null'
        - if:
            properties:
              status:
                const: resolved
          then:
            properties:
              resolution:
                $ref: '#/components/schemas/ReceivingDiscrepancyResolution'
            allOf:
              - if:
                  properties:
                    source_kind:
                      const: po
                then:
                  properties:
                    resolution:
                      properties:
                        resolution_kind:
                          enum:
                            - supplier_replacement_received
                            - returned_to_supplier
                            - credit_or_short_closed
                else:
                  properties:
                    resolution:
                      properties:
                        resolution_kind:
                          const: donated_declined_or_disposed
