              maxLength: 80
              pattern: '\S'
            - type: 'null'
        rf_line_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        rf_material_version:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 2147483647
            - type: 'null'
