                type: 'null'
              rf_line_id:
                type: 'null'
    RepfLineNeedBreakdown:
      type: object
      additionalProperties: false
      required:
        - snapshot_version
        - observed_at
        - approved_rop
        - approved_target_level
        - usable_stockroom_on_hand
        - eligible_usable_stockroom_on_hand
        - active_rf_reservations
        - eligible_available_to_allocate
        - unreserved_approved_rf_shortage
        - open_repf_quantity
        - open_po_inbound_quantity
        - total_open_inbound_coverage
        - excluded_inbound_quantity
        - gross_rf_shortage_need
        - gross_rop_replenishment_need
        - gross_combined_need
        - uncovered_rf_shortage_quantity
        - uncovered_rop_replenishment_quantity
        - variant_proposed_uncovered_quantity
        - uncovered_need
