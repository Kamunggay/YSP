        - sequence_width
      properties:
        document_kind:
          const: IS_AR
        prefix:
          type: string
          pattern: '^[A-Z0-9]{1,12}$'
        year_basis:
          const: Asia/Manila
        sequence_width:
          type: integer
          minimum: 6
          maximum: 12
    AllocationPriorityPolicyValue:
      type: object
