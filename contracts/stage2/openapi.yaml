openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: YSP Stage 2 canonical HTTP agreement
  version: 0.5.1
  description: >-
    Specification #27 canonical Stage 2 contract package (tickets 01-06) with
    strictly additive v0.5.1 candidate-list amendment (Leader typed searchable
    candidate endpoints plus additive q/eligible_for selectors on Leader's five
    remaining Stage 2 list routes). Reuses Stage 1 transport, cookie/CSRF security,
    X-Action-Key idempotency, snapshot-bound cursor pagination, scalar formats,
    error/blocker envelopes, and BoundedRestriction verbatim. Defines controlled
    CLI-only Stage 2 policies, additive EvidencePurpose values, Leader
    checkEvidenceBinding reuse, Glenn live net-shortage/ROP query and
    computeNetShortageSnapshot participant, RepF intake/budget review, nested
    quotations, policy-gated supplier selection, Purchase Order lifecycle/amendments,
    Donation Acknowledgments and donor-restriction resolutions, unified PO/DA
    Receiving Reports with Efren prepareReceivingInventory, receiving discrepancy
    loops, missing-source delivery holds, action-receipt recovery, Glenn INV-09
    allocation queue, Leader derived duty-filtered officer alerts, and structured
    JSON plus printable HTML Stage 2 inventory, procurement, and control reports.
    agreement.md defines normative authorization, locking, calculation, ownership,
    and coordination rules.
servers:
  - url: /
    description: Same origin as the browser; HTTPS required except isolated loopback development.
security: []
tags:
  - name: Replenishment
    description: Live chapter-scoped net-shortage and Reorder Point (ROP) replenishment visibility owned by Glenn.
  - name: Donations
    description: In-kind Donation / Sponsorship Acknowledgment and donor-restriction controls owned by Leader.
  - name: RepF
    description: Chapter-funded Replenishment Form (RepF) intake, net-need duplicate guard, and independent budget review owned by Leader.
  - name: Quotations
    description: Nested RepF supplier quotation comparison and policy-gated supplier selection owned by Leader (inline supplier metadata; no standalone /suppliers CRUD).
  - name: Purchase Orders
    description: Purchase Order preparation, independent approval/issuance, optional supplier acknowledgment, controlled amendments, short-closure, cancellation, history, and print owned by Leader.
  - name: Procurement Operations
    description: Action-receipt recovery lookups for uncertain Stage 2 procurement mutations (RepF, quotations, supplier selections, and Purchase Orders) owned by Leader.
  - name: Receiving Reports
    description: Unified Stage 2 purchased (PO-RM) and donated (DA-RM) Receiving Report inspection, signed-paper evidence matching, atomic stockroom/quarantine posting, movements, discrepancies, history, and print owned by Leader (Stage 1 /opening-rms unchanged).
  - name: Receiving Discrepancies
    description: Receiving discrepancy follow-up and evidence-backed resolution loops for damaged or rejected PO/DA deliveries owned by Leader (RCV-05, RCV-06, INV-14).
  - name: Receiving Holds
    description: Missing-source delivery hold intake, source linking, and authorized refusal/return outside usable stock with zero IPC creation owned by Leader (RCV-01, RCV-10, S3-15).
  - name: Receiving Operations
    description: Action-receipt recovery lookups for uncertain Stage 2 receiving, discrepancy, and missing-source hold mutations owned by Leader.
  - name: Allocation Queue
    description: Glenn INV-09 eligible-demand allocation queue connecting newly posted PO and DA stockroom lots to Stage 1 unchanged RF reservation and repeated signed actual-issue flows.
  - name: Officer Alerts
    description: Leader live chapter-scoped, duty-filtered officer alert feed (RPT-01) with zero persisted acknowledgment or dismissal state.
  - name: Reports
    description: Leader structured JSON and printable HTML (/print) views for Stage 2 inventory (RPT-03), demand/procurement (RPT-04), and control/donation (RPT-06) reports (RPT-05 and binary PDF/CSV RPT-07 deferred).
  - name: Candidates
    description: Leader-owned typed searchable candidate endpoints (v0.5.1 additive amendment) for officers, requesting units, ready signed-paper evidence, and active chapter events.

paths:
  /api/v1/chapters/{chapter_id}/replenishment/needs:
    get:
      operationId: listReplenishmentNeeds
      tags:
        - Replenishment
      x-owner: Glenn
      x-existence: new
      x-required-action: replenishment.read
      summary: Query live chapter net-shortage and ROP replenishment needs
      description: >-
        Current full individual session/MFA, chapter membership, and replenishment.read
        duty are required on every call. Powered synchronously by Glenn's internal
        computeNetShortageSnapshot participant. Computes approved ROP, approved target
        stock level, usable stockroom on-hand, eligible usable stockroom on-hand, active
        RF reservations, unreserved approved RF shortages, open RepF/PO inbound coverage,
        low-stock breach indicator (usable_stockroom_on_hand <= approved_rop), and
        non-overlapping proposed uncovered replenishment quantity per INV-10 through
        INV-12 and PRC-02. Safe GET accepts no request body and no X-Action-Key. Reject
        unknown or repeated query selectors with 400 invalid_selector. Missing or expired
        quantity_scale setup for any evaluated variant, or missing/expired ROP or
        target_level setup when trigger_filter=rop_breach, returns 409 setup_blocked; for
        trigger_filter=all or rf_shortage, missing ROP/target appears in each row's
        setup_blockers without hiding active approved RF shortages (INV-10). Expired or
        mutated 5-minute cursors return 409 snapshot_stale. Every response sends
        Cache-Control: no-store.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/ChapterId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/SnapshotCursor'
        - $ref: '#/components/parameters/ReplenishmentItemFilter'
        - $ref: '#/components/parameters/ReplenishmentVariantFilter'
        - $ref: '#/components/parameters/ReplenishmentTriggerFilter'
        - $ref: '#/components/parameters/CatalogueSearch'
      responses:
        '200':
          description: Current authorized snapshot of chapter replenishment needs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentNeedList'
        '400':
          $ref: '#/components/responses/InvalidSelector'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ChapterAccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ReplenishmentNeedsConflict'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/chapters/{chapter_id}/donations:
    get:
      operationId: listDonations
      tags:
      - Donations
      x-owner: Leader
      x-existence: new
      x-required-action: da.read
      summary: List chapter DAs
      description: List visible records by updated_at descending, then da_id ascending. Reject unknown or repeated
        selectors.
      security:
      - browserSession: []
      parameters:
      - {$ref: '#/components/parameters/ChapterId'}
      - {$ref: '#/components/parameters/PageLimit'}
      - {$ref: '#/components/parameters/SnapshotCursor'}
      - {$ref: '#/components/parameters/DonationStatusFilter'}
      - {$ref: '#/components/parameters/CandidateSearchQuery'}
      - {$ref: '#/components/parameters/DonationEligibleForFilter'}
      responses:
        '200':
          description: Current DA page.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationList'}
        '400': {$ref: '#/components/responses/InvalidSelector'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ChapterAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/DonationSnapshotStale'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createDonation
      tags:
      - Donations
      x-owner: Leader
      x-existence: new
      x-required-action: da.draft
      summary: Create an in-kind donation draft
      security:
      - browserSession: []
        csrfProof: []
      parameters:
      - {$ref: '#/components/parameters/ChapterId'}
      - {$ref: '#/components/parameters/Origin'}
      - {$ref: '#/components/parameters/ActionKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DonationDraft'}
      responses:
        '201': {$ref: '#/components/responses/DonationMutationCreated'}
        '400': {$ref: '#/components/responses/DonationMalformedRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/DonationMutationDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/DonationMutationConflict'}
        '415': {$ref: '#/components/responses/DonationUnsupportedMedia'}
        '419': {$ref: '#/components/responses/DonationCsrfMismatch'}
        '422': {$ref: '#/components/responses/DonationValidationFailed'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chapters/{chapter_id}/donations/{da_id}:
    get:
      operationId: readDonation
      tags:
      - Donations
      x-owner: Leader
      x-existence: new
      x-required-action: da.read
