        - additional_purchase_reason
        - notes
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        line_number:
          type: integer
          minimum: 1
          maximum: 100
        trigger_kind:
          $ref: '#/components/schemas/RepfTriggerKind'
        item_id:
