        unreserved_approved_rf_shortage:
          $ref: '#/components/schemas/StockQuantity'
        open_repf_quantity:
          $ref: '#/components/schemas/StockQuantity'
        open_po_inbound_quantity:
          $ref: '#/components/schemas/StockQuantity'
        total_open_inbound_coverage:
          $ref: '#/components/schemas/StockQuantity'
        excluded_inbound_quantity:
          $ref: '#/components/schemas/StockQuantity'
        gross_rf_shortage_need:
          $ref: '#/components/schemas/StockQuantity'
        gross_rop_replenishment_need:
          $ref: '#/components/schemas/StockQuantity'
        gross_combined_need:
          $ref: '#/components/schemas/StockQuantity'
        uncovered_rf_shortage_quantity:
          $ref: '#/components/schemas/StockQuantity'
        uncovered_rop_replenishment_quantity:
          $ref: '#/components/schemas/StockQuantity'
        variant_proposed_uncovered_quantity:
          $ref: '#/components/schemas/StockQuantity'
        uncovered_need:
          $ref: '#/components/schemas/StockQuantity'
          description: Live non-overlapping uncovered need for this line's trigger (uncovered_rf_shortage_quantity for rf_shortage; uncovered_rop_replenishment_quantity for rop_replenishment).
        exceeds_uncovered_need:
          type: boolean
          description: True iff requested_quantity > uncovered_need; requires explicit additional_purchase_reason.
      description: Server-computed net-need breakdown recorded from Glenn's computeNetShortageSnapshot (PRC-02, PRC-03, INV-11).
