deferred_scope:
  stage3_sales_and_payments: Sales Orders (so_shortage rejected), Sales Invoices, verified payments/Official Receipts, payment
    allocations, release coverage, and 48-hour expiry clocks.
  stage4_booths_and_adj: Event booth custody/sales, manual outage entries, Stock Adjustment / Return Slips (ADJ), refunds/unequal
    exchanges, and booth close-out reconciliation.
  rpt05_finance_and_booth_reports: Sales Invoices, Official Receipts, payment allocations, booth custody/sales, and cash/remittance
    reconciliations do not exist in Stage 2. No /reports/finance or /reports/booth routes are exposed in Stage 2.
  rpt07_binary_exports: 'Binary PDF generation and CSV export streaming are explicitly deferred per specification #27 MVP
    scope. Stage 2 delivers structured JSON reports and escaped non-executable printable HTML (/print) views enforcing identical
    chapter/duty scoping, explicit filters, units, PHP currency, stock category labels, server report time, Cache-Control:
    no-store, PrintCsp, and NoSniff.'
  standalone_suppliers_and_http_policy_ui: No /suppliers master CRUD, no public HTTP policy-admin routes, and no persisted
    alert ack/dismiss writes.
