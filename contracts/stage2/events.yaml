    - stage2.repf.changed.v1
    - stage2.purchase-order.changed.v1
    when: Preserves Stage 1 cancelInternalRf events verbatim (stage1.internal-rf.changed.v1 plus Stage 1
      reservation/stock-lot/preparation notices per contracts/stage1/events.yaml) without deadlocking on open Stage 2
      records; additionally co-emits stage2.repf.changed.v1 and stage2.purchase-order.changed.v1 inside the same
      commit strictly for linked open RepFs and POs flagged with linked_demand_canceled=true. Never emits on
      rollback, rejection, no-op, or identical replay.
