contract_version: 2.0.0
status: candidate; specified only, no Stage 2 WebSocket runtime
channel_conventions:
  logical_chapter_channel: private-stage1.chapter.{chapter_id}
  delivery_chapter_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
  delivery_session_channel: private-stage1.user.{user_id}
  authorization_operations:
  - authorizeSessionNotifications
  - authorizeChapterNotifications
  synthetic_alert_events_allowed: false
definitions:
  stage2.repf.changed.v1:
    schema: '#/$defs/repf'
    subject_schema: Repf
    id_field: id
    resource_version_field: version
    material_version_field: material_version
    owner: Leader
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    audience: Current enabled full-session user with active URL-chapter membership AND exact repf.read (or quotation.read
      for nested quotations) scope; derived alert/replenishment/report refreshes still require their own GET duties.
      Re-evaluate before each recipient dispatch.
    refresh_operations:
    - readRepf
    - listRepfs
    - listRepfHistory
    - listRepfRelatedRecords
    - listRepfQuotations
    - listReplenishmentNeeds
    - listOfficerAlerts
    - readProcurementReport
    - readControlReport
  stage2.purchase-order.changed.v1:
    schema: '#/$defs/purchase-order'
    subject_schema: PurchaseOrder
    id_field: id
    resource_version_field: version
    material_version_field: material_version
    owner: Leader
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    audience: Current enabled full-session user with active URL-chapter membership AND exact po.read scope; derived
      replenishment/alert/report and Stage 1 inbound_open_po stock refreshes still require their own GET duties.
      Re-evaluate before each recipient dispatch.
    refresh_operations:
    - readPurchaseOrder
    - listPurchaseOrders
    - listPurchaseOrderHistory
    - listPurchaseOrderRelatedRecords
    - listReplenishmentNeeds
    - listOfficerAlerts
    - readInventoryReport
    - readProcurementReport
    - readControlReport
    dependent_refresh_rule: Mounted Stage 1 stock screens (listStockSummaries, readVariantStock) also refresh live
      inbound_open_po commitments without modifying usable_stockroom_on_hand or available_to_allocate (PRC-07, PRC-09).
  stage2.donation.changed.v1:
    schema: '#/$defs/donation'
    subject_schema: Donation
    id_field: da_id
    resource_version_field: version
    material_version_field: material_version
    owner: Leader
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    audience: Current enabled full-session user with active URL-chapter membership AND exact da.read scope (plus
      Stage 1 history.read for history queries); derived alert and control report refreshes require their own GET
      duties. Re-evaluate before each recipient dispatch.
    refresh_operations:
    - readDonation
    - listDonations
    - listDonationHistory
    - listDonationRelated
    - listOfficerAlerts
    - readControlReport
  stage2.receiving-report.changed.v1:
    schema: '#/$defs/receiving-report'
    subject_schema: ReceivingReport
    id_field: id
    resource_version_field: version
    material_version_field: material_version
    owner: Leader
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    audience: Current enabled full-session user with active URL-chapter membership AND exact receiving.read scope;
      replenishment, allocation queue, alert, and report refreshes still require their own GET duties. Re-evaluate
      before each recipient dispatch.
    refresh_operations:
    - readReceivingReport
    - listReceivingReports
    - listReceivingReportMovements
    - listReceivingReportDiscrepancies
    - listReceivingReportHistory
    - listReceivingReportRelated
    - listReplenishmentNeeds
    - listAllocationQueue
    - listOfficerAlerts
    - readInventoryReport
    - readProcurementReport
    - readControlReport
  stage2.receiving-discrepancy.changed.v1:
    schema: '#/$defs/receiving-discrepancy'
    subject_schema: ReceivingDiscrepancy
    id_field: id
    resource_version_field: version
    material_version_field: material_version
    owner: Leader
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    audience: Current enabled full-session user with active URL-chapter membership AND exact receiving.read scope;
      replenishment, alert, and report refreshes still require their own GET duties. Re-evaluate before each
      recipient dispatch.
    refresh_operations:
    - readReceivingDiscrepancy
    - listReceivingDiscrepancies
    - listReceivingReportDiscrepancies
    - listReplenishmentNeeds
    - listOfficerAlerts
    - readProcurementReport
    - readControlReport
  stage2.receiving-hold.changed.v1:
    schema: '#/$defs/receiving-hold'
    subject_schema: ReceivingHold
    id_field: id
    resource_version_field: version
    material_version_field: material_version
    owner: Leader
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    audience: Current enabled full-session user with active URL-chapter membership AND exact receiving.read scope;
      alert and control report refreshes still require their own GET duties. Re-evaluate before each recipient
      dispatch.
    refresh_operations:
    - readReceivingHold
    - listReceivingHolds
    - listReceivingHoldHistory
    - listOfficerAlerts
    - readControlReport
co_emitted_stage1_events:
  stage1.stock-lot.changed.v1:
    canonical_contract: contracts/stage1/events.yaml
    owner: Efren
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    co_emitted_by:
    - postReceivingReport
    - resolveDonationRestriction
    stage2_refresh_operations:
    - listReplenishmentNeeds
    - listAllocationQueue
    - listOfficerAlerts
    - readInventoryReport
    - readControlReport
    rule: Reused verbatim from Stage 1 (8-field envelope, StockLot id/stock_version/material_version). Co-emitted
      on postReceivingReport for every posted usable/quarantined/rejected lot created by prepareReceivingInventory
      and on resolveDonationRestriction only when resolution_kind is apply and applyLotRestrictionResolution updates
      remaining posted stockroom lot segments (never on audit_review or zero existing segments). Stage 1 /stock*
      refreshes remain governed by contracts/stage1/events.yaml.
  stage1.internal-rf.changed.v1:
    canonical_contract: contracts/stage1/events.yaml
    owner: Glenn
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    co_emitted_by:
    - cancelInternalRf
    stage2_refresh_operations:
    - listReplenishmentNeeds
    - listAllocationQueue
    - listOfficerAlerts
    - readProcurementReport
    rule: Preserved unchanged on Stage 1 cancelInternalRf (and all other Stage 1 RF mutations). When cancelInternalRf
      cancels an unissued RF remainder with linked open RepFs or POs, it flags linked_demand_canceled=true in the
      same transaction and co-emits stage2.repf.changed.v1 and stage2.purchase-order.changed.v1 so demand_changed
      alerts and procurement views refresh automatically without blocking RF cancellation.
  stage1.chapter-setup.changed.v1:
    canonical_contract: contracts/stage1/events.yaml
    owner: Leader
    channel: chapter
    logical_channel: private-stage1.chapter.{chapter_id}
    delivery_channel: private-stage1.chapter.{chapter_id}.user.{user_id}
    co_emitted_by:
    - recordPolicy
    stage2_refresh_operations:
    - listReplenishmentNeeds
    - listAllocationQueue
    - listOfficerAlerts
    - readInventoryReport
    - readProcurementReport
    - readControlReport
    rule: Emitted on committed CLI recordPolicy changes for Stage 2 policies (purchasing_quotation_policy,
      da_authorization, reference_series REPF/PO/DA) and reused Stage 1 policies (rop, target_level, quantity_scale,
      valuation_rounding, allocation_priority, shared RM series). Refreshes only permitted mounted screens; grants
      no read authority.
  stage1.authority.changed.v1:
    canonical_contract: contracts/stage1/events.yaml
    owner: Leader
    channel: session
    logical_channel: private-stage1.user.{user_id}
    delivery_channel: private-stage1.user.{user_id}
    co_emitted_by:
    - recordPolicy
    stage2_refresh_operations: []
    rule: Reused verbatim from Stage 1 on the user's private session channel when membership, duty grants, limits,
      or authority policies change. Clients re-verify Stage 1 readCurrentSession, listMyChapterMemberships,
      readChapterContext, and readChapterAccess and immediately purge forbidden Stage 2 projections and edit buffers.
