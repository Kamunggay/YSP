scenarios:
- name: committed-change
  http_cases:
  - stage2-05-rm-post-po-partial-40-accepted-10-rejected
  - stage2-05-rm-read
  - stage2-05-discrepancy-read
  - stage2-06-allocation-queue-inv09-mixed-sku
  - stage2-01-combined-rf-shortage-and-rop
  - stage2-06-alerts-multi-duty-all-categories
  - stage2-06-report-inventory-json
  - stage2-06-report-procurement-json
  events:
  - stage2.receiving-report.changed.v1
  - stage1.stock-lot.changed.v1
  - stage2.purchase-order.changed.v1
  - stage2.receiving-discrepancy.changed.v1
  notice_examples:
  - receiving-report-committed
  - purchase-order-committed
  - receiving-discrepancy-committed
  expectation: Posting partial PO-RM (40 accepted, 10 rejected) persists outbox intents inside the same commit
    for the RM, affected stock lots (stage1.stock-lot.changed.v1), PO progress, and opened discrepancy. Mounted
    permitted reads refresh allocation queue, replenishment needs, alerts, and reports without counting quantities
    from events or emitting synthetic alert-only events.
- name: donation-restriction-resolution
  http_cases:
  - stage2-04-resolve-uninterpreted-to-bounded
  - stage2-04-audit-inexpressible-condition
  - stage2-04-read-acknowledged-da
  - stage2-06-allocation-queue-inv09-mixed-sku
  - stage2-06-report-control-json
  events:
  - stage2.donation.changed.v1
  - stage1.stock-lot.changed.v1
  notice_examples:
  - donation-committed
  expectation: Applied donor-restriction resolution co-emits stage2.donation.changed.v1 and stage1.stock-lot.changed.v1
    only for stockroom lot segments actually updated by applyLotRestrictionResolution. Audit-only review emits
    only stage2.donation.changed.v1 and keeps ADR 0004 uninterpreted stock blocked.
- name: failed-command
  http_cases:
  - stage2-05-rm-overdelivery-blocked-conflict
  - stage2-02-repf-duplicate-supply-coverage-conflict
  - stage2-03-selection-quotation-policy-unmet
  events: []
  expectation: Rejected or rolled-back mutations (overdelivery/substitution, duplicate supply coverage, unmet
    quotation policy, stale versions, or action-key conflicts) persist zero outbox rows and emit zero events;
    existing authoritative server state and unsaved form input remain intact.
- name: duplicate-or-delayed
  http_cases:
  - stage2-02-repf-read-linked-demand-canceled
  - stage2-03-po-read
  events:
  - stage2.repf.changed.v1
  - stage2.purchase-order.changed.v1
  notice_examples:
  - repf-committed
  - purchase-order-committed
  expectation: Redelivered event_id or an older resource_version arriving after a newer version is deduplicated
    or reconciled via current safe GET; slow older GET responses are discarded by generation; no mutation is
    replayed.
- name: missed-event-reconnect
  http_cases:
  - stage2-02-procurement-operation-recover-by-key
  - stage2-04-find-committed-resolution
  - stage2-05-recovery-by-key-post-rm
  - stage2-01-combined-rf-shortage-and-rop
  - stage2-06-allocation-queue-inv09-mixed-sku
  - stage2-06-alerts-multi-duty-all-categories
  events: []
  expectation: After disconnect or focus return, suspend consequential commands, re-verify Stage 1 session/MFA/
    membership/context/access, obtain a fresh owned socket subscription acknowledgment via Stage 1
    authorizeSessionNotifications/authorizeChapterNotifications, buffer incoming hints, refresh mounted permitted
    Stage 2 GET screens, and recover pending same-person mutations via /procurement-operations/by-key,
    /donation-operations/by-key, and /receiving-operations/by-key without replaying any write.
- name: chapter-change
  http_cases:
  - stage2-01-chapter-not-found
  - stage2-05-hold-read
  events: []
  notice_examples:
  - receiving-hold-committed
  expectation: On explicit chapter switch, increment context generation, cancel in-flight old-chapter GETs,
    unsubscribe old private-stage1.chapter.{old_chapter_id}.user.{user_id}, park permitted same-person drafts
    under their origin chapter/resource/base material_version, admit and sweep the new chapter, and deny
    unadmitted chapters uniformly with 404 chapter_not_found. Late old-chapter notices never affect the new chapter.
- name: revocation
  http_cases:
  - stage2-01-unauthorized-duty-denied
  - stage2-06-alerts-duty-denied
  - stage2-06-report-control-duty-denied
  - stage2-04-find-uncommitted-resolution
  events:
  - stage1.authority.changed.v1
  expectation: Membership or duty revocation fences server recipient dispatch before any subsequent delivery and
    closes affected subscriptions. Re-evaluation on each recipient dispatch prevents disclosing Stage 2 resource
    UUIDs to revoked users; subsequent HTTP reads return uniform 403 duty_denied or 404 without reversing
    already-committed records.
- name: disabled-or-other-user
  http_cases:
  - stage2-01-chapter-not-found
  - stage2-02-procurement-operation-not-found
  events: []
  expectation: Disabling an account, signing out, or replacing the authenticated identity disconnects sockets and
    purges all Stage 2 cached projections, private action keys, and identity-bound in-memory edit buffers; another
    user never inherits retained edits or operation results.
- name: preserved-edit
  http_cases:
  - stage2-02-repf-read-linked-demand-canceled
  - stage2-03-po-read
  - stage2-05-rm-read
  events:
  - stage2.repf.changed.v1
  - stage2.purchase-order.changed.v1
  - stage2.receiving-report.changed.v1
  notice_examples:
  - repf-committed
  - purchase-order-committed
  - receiving-report-committed
  expectation: 'For the same enabled authorized user in the same permitted chapter, unsaved form text (RepF lines,
    PO terms, DA lines, RM inspection counts, discrepancy or hold notes) and original base material_version stay
    in memory when a newer committed notice triggers a background GET. Fresh server data stages beside the dirty
    form with a stale/conflict indicator requiring explicit review; background refresh never overwrites inputs or
    auto-submits.'
