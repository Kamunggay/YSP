# Run identity is required: never inherit the development volume or image.
name: ${CI_RUNTIME_PROJECT:?Prepare the runtime identity first}

services:
  backend:
    image: ${CI_RUNTIME_PROJECT}-backend:ci
    container_name: ${CI_RUNTIME_PROJECT}-backend
    environment:
      APP_ENV: testing
      COMPOSER_CACHE_DIR: /composer-cache
    volumes:
      - type: bind
        source: ${CI_COMPOSER_CACHE:?Set the job-local Composer download directory}
        target: /composer-cache
  mysql:
    container_name: ${CI_RUNTIME_PROJECT}-mysql

volumes:
  mysql_data:
    name: ${CI_RUNTIME_PROJECT}-mysql-data
