server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # Docker DNS resolves the current backend after stop/start or recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location ~ ^/api(?:/|$) {
        set $api_backend backend:8080;
        proxy_pass http://$api_backend;
        proxy_hide_header Cache-Control;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 5s;
        error_page 502 504 =503 /api-unavailable;
    }
    location = /api-unavailable {
        internal;
        default_type application/json;
        return 503 '{"status":"unavailable","database":"unavailable"}';
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
