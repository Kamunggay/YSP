map $request_id $evidence_error_id {
    "~^(?<ea>[0-9a-f]{8})(?<eb>[0-9a-f]{4}).(?<ec>[0-9a-f]{3}).(?<ed>[0-9a-f]{3})(?<ee>[0-9a-f]{12})$" "$ea-$eb-4$ec-8$ed-$ee";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto ${YSP_PUBLIC_SCHEME};
    proxy_set_header X-Forwarded-For $remote_addr;

    location ~ ^/api/v1/chapters/[^/]+/evidence(?:/[^/]+/versions)?/?$ {
        client_max_body_size 64m;
        error_page 413 = @evidence_too_large;
        proxy_pass http://backend:8000;
    }

    location @evidence_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"request_id":"$evidence_error_id","error":{"code":"evidence_too_large","message":"The evidence upload exceeds its size limit."}}';
    }

    location /app/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $notification_upstream http://reverb:8080;
        proxy_pass $notification_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        access_log off;
    }

    location ~ ^/api/v1/chapters/[^/]+/procurement-operations/by-key/?$ {
        access_log off;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
